<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나는 자료 분석가</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   디자인 토큰 (캔바 시안이 있으면 이 값만 바꾸면 됩니다)
   ========================================================= */
:root{
  --primary:#7D2AE8;
  --secondary:#00C4CC;
  --grad:linear-gradient(135deg,#7D2AE8 0%,#00C4CC 100%);
  --bg:#F6F4FB;
  --card:#FFFFFF;
  --ink:#1F1A2E;
  --ink-2:#5B5670;
  --line:#E6E1F2;
  --radius:20px;      /* 카드 모서리 */
  --radius-sm:16px;   /* 카드 안 상자 */
  --radius-xs:12px;   /* 입력칸·작은 칩 */
  --gap:24px;         /* 카드 사이 간격 */
  --gap-sm:16px;      /* 카드 안 요소 간격 */
  --shadow:0 4px 16px rgba(30,20,60,.08);
  --shadow-lg:0 10px 30px rgba(30,20,60,.14);
  --ok:#1E9E5A; --bad:#D93A4A;
  --font:'Pretendard','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --c-review:#FF8A3D; --c-rep:#7D2AE8; --c-stem:#2BB673; --c-freq:#1E88E5;
  --c-hist:#00A3AD; --c-play:#FF5C8A; --c-rel:#F4B400; --c-proj:#5B4BDB; --c-lab:#00C4CC;
  --header-h:72px; --side-w:336px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:16px;line-height:1.6;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
h1,h2,h3,h4{line-height:1.3;margin:0}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--secondary);outline-offset:2px;border-radius:8px}

/* ---------- 상단 바 ---------- */
.topbar{position:sticky;top:0;z-index:40;height:var(--header-h);background:var(--grad);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;box-shadow:0 2px 12px rgba(60,20,120,.25)}
.hamburger{display:grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:var(--radius-xs);background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:40px;height:40px;border-radius:var(--radius-xs);background:#fff;display:grid;place-items:center;flex:none}
.brand h1{font-size:20px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-size:12px;font-weight:500;opacity:.9;white-space:nowrap}
.progress-wrap{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:180px;max-width:360px;flex:1}
.progress-label{font-size:13px;font-weight:700;white-space:nowrap}
.progress{flex:1;height:12px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.progress > i{display:block;height:100%;width:0;background:#fff;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- 레이아웃 ---------- */
.layout{display:flex;min-height:calc(100vh - var(--header-h))}
.sidebar{width:var(--side-w);flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.side-title{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;padding:4px 10px 8px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 10px;border:0;border-radius:14px;background:transparent;text-align:left;cursor:pointer;transition:background .15s}
.nav-item:hover{background:#F3EFFC}
.nav-item.active{background:#EFE6FD;box-shadow:inset 4px 0 0 var(--c)}
.nav-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--c);color:#fff;font-size:18px}
.nav-text{flex:1;min-width:0}
.nav-num{display:block;font-size:11px;color:var(--ink-2);font-weight:700}
.nav-name{display:block;font-size:15px;font-weight:700;line-height:1.3}
.nav-state{font-size:13px;font-weight:700;flex:none;min-width:26px;text-align:center}
.nav-state.done{color:var(--ok)}
.nav-item.locked{opacity:.45}
.nav-item.locked .nav-ico{filter:grayscale(1)}
.side-sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{margin-top:auto;padding-top:12px}
.teacher-btn{width:100%;min-height:44px;border-radius:999px;border:1.5px dashed #C9BDEB;background:#fff;color:var(--ink-2);font-weight:700;cursor:pointer}
.teacher-btn.on{border-style:solid;border-color:var(--primary);color:var(--primary);background:#F5EEFF}
.teacher-tools{display:none;flex-direction:column;gap:6px;margin-top:8px}
.teacher-tools.show{display:flex}
.scrim{display:none}

.main{flex:1;min-width:0;padding:28px 24px 40px}
.container{max-width:1200px;margin:0 auto}

/* ---------- 학습 머리 ---------- */
.lesson-head{position:relative;border-radius:var(--radius);padding:26px 28px;background:#fff;box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;gap:20px;margin-bottom:var(--gap)}
.lesson-head::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.lesson-head .big-ico{width:64px;height:64px;border-radius:var(--radius);background:var(--c);display:grid;place-items:center;font-size:32px;color:#fff;flex:none}
.lesson-head .eyebrow{font-size:13px;font-weight:700;color:var(--c-dark,var(--c))}
.lesson-head h2{font-size:28px;font-weight:900;letter-spacing:-.02em}
.lesson-head p{margin:4px 0 0;color:var(--ink-2)}
.lesson-head .banner-img{position:absolute;right:0;top:0;height:100%;width:38%;object-fit:cover;opacity:.95;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.lesson-head > :not(.banner-img){position:relative;z-index:1}
@media (max-width:767px){ .lesson-head .banner-img{width:34%;opacity:.45} }

/* ---------- 카드 ---------- */
.cards{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.card{grid-column:span 12;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;position:relative;border-top:4px solid var(--c,var(--primary))}
.card.half{grid-column:span 6}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--pill-bg,#F1EAFE);color:var(--pill-fg,var(--primary));margin-bottom:12px}
.pill.goal{--pill-bg:#FFF1E6;--pill-fg:#C2550F}
.pill.open{--pill-bg:#E6FAFB;--pill-fg:#007C82}
.pill.concept{--pill-bg:#F1EAFE;--pill-fg:#6420C2}
.pill.explore{--pill-bg:#E8F7EF;--pill-fg:#16804A}
.pill.quiz{--pill-bg:#FFEAF1;--pill-fg:#C21E56}
.card h3{font-size:20px;font-weight:800;margin-bottom:8px}
.muted{color:var(--ink-2)}
.placeholder{display:flex;align-items:center;gap:14px;padding:18px;border:2px dashed var(--line);border-radius:var(--radius-sm);color:var(--ink-2);background:#FBFAFE}
.placeholder b{color:var(--ink)}
.concept-box{border:2px solid var(--c,var(--primary));border-radius:var(--radius-sm);padding:16px 18px;background:#fff;position:relative}
.concept-box::before{content:"개념";position:absolute;top:-12px;left:14px;background:var(--c,var(--primary));color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.guide{display:flex;gap:14px;align-items:flex-start}
.guide-ava{width:64px;height:64px;flex:none}
.bubble{position:relative;background:#F3EFFC;border-radius:var(--radius);padding:14px 18px;font-weight:500}
.bubble::before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-right-color:#F3EFFC;border-left:0}


/* ---------- 학습 단계 카드 격자 + 펼치기 ---------- */
.stage-grid{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:var(--gap-sm);margin-bottom:var(--gap)}
.stage-tile{--k:#7D2AE8;--kbg:#F1EAFE;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:132px;padding:16px 16px 14px;border-radius:var(--radius);border:2px solid transparent;background:#fff;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s}
.stage-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stage-tile[aria-selected=true]{border-color:var(--k);background:var(--kbg);transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,20,60,.14)}
.stage-tile[aria-selected=true]::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:var(--kbg);border-right:2px solid var(--k);border-bottom:2px solid var(--k);transform:translateX(-50%) rotate(45deg)}
.stage-num{position:absolute;top:12px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--kbg);color:var(--k);font-size:13px;font-weight:900;display:grid;place-items:center}
.stage-tile[aria-selected=true] .stage-num{background:var(--k);color:#fff}
.stage-ico{width:46px;height:46px;border-radius:14px;background:var(--kbg);display:grid;place-items:center;font-size:24px;margin-bottom:6px}
.stage-tile[aria-selected=true] .stage-ico{background:#fff}
.stage-label{font-size:16px;font-weight:900;color:var(--ink);line-height:1.25;word-break:keep-all}
.stage-hint{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.stage-check{position:absolute;bottom:12px;right:14px;font-size:13px;font-weight:900;color:var(--ok);opacity:0}
.stage-tile.seen .stage-check{opacity:1}
.k-goal{--k:#E8742A;--kbg:#FFF1E6}
.k-open{--k:#00A3AD;--kbg:#E6FAFB}
.k-concept{--k:#7D2AE8;--kbg:#F1EAFE}
.k-explore{--k:#1E9E5A;--kbg:#E8F7EF}
.k-quiz{--k:#E0306E;--kbg:#FFEAF1}
.k-summary{--k:#C26A00;--kbg:#FFF4DB}
.k-check{--k:#2563EB;--kbg:#E8F0FE}
.stage-panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:2px solid var(--k);padding:24px 26px}
.stage-panel.pop{animation:stageIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes stageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stage-panel-head{display:flex;align-items:center;gap:14px;padding-bottom:14px;margin-bottom:var(--gap);border-bottom:1.5px dashed var(--line)}
.stage-panel-ico{width:52px;height:52px;border-radius:var(--radius-sm);background:var(--kbg);display:grid;place-items:center;font-size:28px;flex:none}
.stage-panel-step{font-size:13px;font-weight:800;color:var(--k)}
.stage-panel-head h3{font-size:22px;font-weight:900}
.stage-foot{display:flex;justify-content:space-between;gap:10px;margin-top:var(--gap);padding-top:16px;border-top:1.5px dashed var(--line)}
.goal-box{display:flex;gap:14px;align-items:flex-start;background:#FFF8F2;border-radius:var(--radius-sm);padding:18px 20px}
.goal-flag{font-size:28px;line-height:1}
.goal-box p{margin:0;font-size:18px;font-weight:800;line-height:1.6}
@media (max-width:1023px){ .stage-grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(96px,1fr);gap:10px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:thin} .stage-hint{display:none} .stage-tile{min-height:112px;padding:14px 12px} }
@media (max-width:767px){
  .stage-grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(78px,1fr);gap:6px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:thin}
  .stage-tile{min-height:86px;padding:10px 4px 8px;align-items:center;text-align:center;gap:2px;border-radius:14px}
  .stage-ico{width:36px;height:36px;font-size:20px;margin:0 0 2px;border-radius:11px}
  .stage-label{font-size:12px;word-break:keep-all}
  .stage-num{top:4px;right:4px;width:18px;height:18px;font-size:10px}
  .stage-check{bottom:4px;right:6px}
  .stage-panel{padding:18px 16px}
  .stage-panel-head h3{font-size:19px}
  .stage-foot .btn{flex:1;padding:0 10px;font-size:14px}
}


/* ---------- 학습 공통 블록 ---------- */
.block{padding:4px 0 22px;margin-bottom:22px;border-bottom:1.5px dashed var(--line)}
.block:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.sub-head{margin-bottom:12px}
.sub-head h4{font-size:18px;font-weight:900;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.sub-head p{margin:4px 0 0}
.todo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--radius-sm);background:#FBFAFE;border:1.5px solid var(--line)}
.todo-ico{font-size:22px;line-height:1}
.todo .muted{font-size:14px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-align:left;line-height:1.35}
.chip:hover{border-color:#C9BDEB}
.chip[aria-pressed=true]{border-color:var(--primary);background:#F5EEFF;color:var(--primary)}
.chip.right{border-color:var(--ok);background:#E9F8F0;color:#11663A}
.chip.wrong{border-color:var(--bad);background:#FDECEE;color:#9A1F2D}
.concept-list{margin:0;padding-left:20px}
.concept-list li{margin:2px 0}
.mini-q{margin-top:14px;padding:14px 16px;border-radius:var(--radius-sm);background:#FBFAFE;border:1.5px solid var(--line)}

/* 환영 카드 */
.welcome{display:grid;gap:14px;margin-bottom:22px}
.welcome-svg,.welcome-img{width:100%;height:auto;display:block;border-radius:var(--radius)}
.welcome-guide .bubble{font-size:17px}

/* 자료 모으기 놀이 */
.how{margin:0 0 10px;font-weight:600;color:var(--ink-2)}
.scatter,.fruit-boxes,.stage-tile,.blocks-svg,.chart svg{user-select:none;-webkit-user-select:none}
.scatter{--cw:58px;position:relative;height:330px;border-radius:var(--radius);background:repeating-linear-gradient(45deg,#FBFAFE 0 14px,#F6F2FD 14px 28px);border:2px dashed #D9CFF2;overflow:hidden}
.fruit-card{touch-action:none;position:absolute;width:var(--cw);height:var(--cw);border-radius:var(--radius-sm);border:2px solid #fff;background:#fff;box-shadow:0 4px 12px rgba(30,20,60,.15);font-size:30px;display:grid;place-items:center;cursor:grab;transform:rotate(var(--rot));transition:transform .15s,box-shadow .15s;touch-action:none;user-select:none;padding:0}
.fruit-card:hover{transform:rotate(0) scale(1.08);z-index:2}
.fruit-card.picked{border-color:var(--primary);box-shadow:0 0 0 4px rgba(125,42,232,.3);transform:rotate(0) scale(1.12);z-index:3}
.fruit-card.dragging{z-index:10;cursor:grabbing;transition:none;box-shadow:0 12px 26px rgba(30,20,60,.3)}
.scatter-done{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:900;color:var(--primary)}
.fruit-boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.fruit-box{min-height:120px;border-radius:var(--radius);border:2.5px solid var(--fc);background:#fff;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;transition:background .15s,transform .15s}
.fruit-box.over{background:#F5EEFF;transform:scale(1.04)}
.fbox-head{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px;white-space:nowrap;word-break:keep-all}
.fbox-head span:first-child{font-size:22px}
.fbox-count{margin-left:auto;min-width:30px;height:30px;border-radius:999px;background:var(--fc);color:#fff;display:grid;place-items:center;font-size:15px}
.fbox-stack{display:flex;flex-wrap:wrap;gap:2px;font-size:18px;line-height:1}
.fbox-chip{animation:pop .35s}
.fruit-box.shake{animation:shake .4s}
.fruit-box.bump{animation:bump .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bump{50%{transform:scale(1.06)}}
.sort-table-row{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
.tcap{caption-side:top;text-align:left;font-weight:800;padding-bottom:6px}
table.data td.filled{background:#F5EEFF;font-weight:900;animation:pop .3s}
.reflect{padding:16px;border-radius:var(--radius);background:#FBFAFE;border:1.5px solid var(--line)}
.reflect textarea{margin-top:10px}

/* 그래프 갤러리 */
.gal-say{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 10px;padding:12px 16px;border-radius:14px;background:#F5EEFF}
.gal-tag{font-size:12px;font-weight:800;background:var(--primary);color:#fff;border-radius:999px;padding:2px 10px}
.gal-chart{min-height:200px}
.pct-check{margin-top:14px}

/* 상황별 그래프 고르기 */
.sit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sit-card{padding:16px;border-radius:var(--radius);border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,background .2s}
.sit-card.solved{border-color:var(--ok);background:#F6FCF8}
.sit-ico{font-size:30px;line-height:1}
.sit-t{font-size:17px}
.sit-fb .ok{color:#11663A;font-weight:700}
.sit-fb .no{color:#9A1F2D;font-weight:700}

/* 평균 블록 */
.block-wrap{background:#FBFAFE;border-radius:var(--radius);border:1.5px solid var(--line);padding:10px}
.blocks-svg{width:100%;max-width:620px;height:auto;display:block;margin:0 auto}
.formula{display:grid;gap:6px}
.formula-line{font-size:18px;padding:8px 14px;border-radius:var(--radius-xs);background:#fff;border:1.5px solid var(--line);animation:stageIn .35s}
.formula-line.key{border:2px solid var(--c-rep);background:#F5EEFF}
.drag-info{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:8px;padding:10px 14px;border-radius:var(--radius-xs);background:#FFF4F5;font-size:15px}
.drag-info b{color:#B5202F}
@media (max-width:767px){
  .scatter{height:400px}
  .scatter{--cw:46px}
  .fruit-card{font-size:24px;border-radius:var(--radius-xs)}
  .fbox-head{font-size:14px;gap:4px}
  .fbox-count{min-width:24px;height:24px;font-size:13px}
  .fbox-head span:first-child{font-size:18px}
  .fruit-boxes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fruit-box{min-height:96px}
  .sit-grid{grid-template-columns:1fr}
  .formula-line{font-size:16px}
}


/* ---------- 1. 대푯값 ---------- */
.goal-box p + p{margin-top:4px}
.think-box{margin-top:16px;padding:14px 16px;border-radius:var(--radius-sm);background:#FFFBEA;border:1.5px dashed #F4B400}
.think-q{font-weight:800}
.think-q span{font-weight:700}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap-sm);margin-top:10px}
.mini-card{padding:14px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:6px}
.mode-ans{font-weight:700}
.stat.hi{border-color:var(--primary);background:#F5EEFF}
.stat-grid.small{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat-grid.small .stat{padding:8px 10px;border-radius:var(--radius-xs)}
.stat-grid.small .stat b{font-size:17px}
.data-strip{padding:8px 12px;border-radius:var(--radius-xs);background:#F6F4FB;font-variant-numeric:tabular-nums;font-weight:700;word-break:keep-all;margin:4px 0}
.data-strip .muted{font-size:13px;font-weight:600;display:block}
.flower-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}
.flower{position:relative;border:2px solid var(--line);border-radius:var(--radius);background:#fff;padding:8px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,border-color .15s}
.flower:hover{transform:translateY(-3px);border-color:#C9BDEB}
.flower.counting{border-color:var(--primary)}
.flower.counted{border-color:var(--ok);background:#F6FCF8}
.flower-svg{width:100%;max-width:120px;height:auto}
.flower-num{font-size:20px;font-weight:900;color:var(--primary);min-height:30px}
.flower.counted .flower-num{color:var(--ok)}
.flower-tag{font-size:12px;color:var(--ink-2);font-weight:700}
.num-pool,.num-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:76px;padding:12px;border-radius:var(--radius-sm)}

.num-card{touch-action:none;width:56px;height:56px;border-radius:14px;border:2px solid var(--c-rep);background:#fff;color:var(--c-rep);font-size:22px;font-weight:900;cursor:grab;touch-action:none;user-select:none;transition:opacity .4s,transform .3s,background .3s}

.num-card.gone{opacity:.18;transform:scale(.85)}
.num-card.mid{background:var(--c-rep);color:#fff;transform:scale(1.15);box-shadow:0 8px 18px rgba(125,42,232,.35)}
.step-label{font-weight:900;color:var(--c-rep);margin-top:8px}
.formula-line .hl{color:#fff;background:var(--c-rep);border-radius:6px;padding:0 4px}
.xlab{background:#FBFAFE;border:1.5px solid var(--line);border-radius:var(--radius);padding:8px}
.xlab-svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.xdot{cursor:ew-resize}
.xdot:focus{outline:none;stroke:#00C4CC;stroke-width:3}
.sit-grid.one{grid-template-columns:repeat(3,minmax(0,1fr))}
.kmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:330px;margin:8px auto 4px}
.kcell{border-radius:var(--radius-xs);padding:6px 4px;text-align:center;line-height:1.2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.kcell b{display:block;font-size:13px}
.kcell span{font-size:17px;font-weight:900}
.klegend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.klegend i{width:120px;height:10px;border-radius:999px;display:inline-block}
.pm-inputs{display:flex;flex-wrap:wrap;gap:12px}
.pm-inputs label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
@media (max-width:1023px){ .sit-grid.one{grid-template-columns:1fr} }
@media (max-width:767px){
  .two-col{grid-template-columns:1fr}
  .flower-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .num-card{width:46px;height:46px;font-size:19px}
}


/* ---------- 2. 줄기와 잎 그림 ---------- */
.val-table{min-width:0}
.val-table td.val{text-align:center;font-size:17px;font-weight:700;min-width:56px}
.val-table.pickable td.val{cursor:pointer;transition:background .2s,opacity .3s}
.val-table.pickable td.val:hover{background:#F0FAF4}
.val-table td.val.is-min{background:#E3F2FD;box-shadow:inset 0 0 0 2px #1E88E5}
.val-table td.val.is-max{background:#FFEBEE;box-shadow:inset 0 0 0 2px #D93A4A}
.val-table td.val.used{opacity:.4;cursor:default}
.val-table td.val.shake{animation:shake .4s}
.sp-t{color:var(--c-stem);font-weight:900}
.sp-o{color:#E8742A;font-weight:900}
.sp-bar{color:var(--ink-2);margin:0 2px}
.split-demo{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 18px;border-radius:var(--radius-sm);background:#F0FAF4}
.split-num{font-size:44px;font-weight:900;letter-spacing:.04em}
.split-arrow{font-size:28px;color:var(--ink-2)}
.split-res{display:flex;align-items:flex-end;gap:10px}
.split-res > div{display:flex;flex-direction:column;align-items:center}
.split-res .sp-t,.split-res .sp-o{font-size:40px;line-height:1.1}
.split-res small{font-size:12px;color:var(--ink-2);font-weight:700}
.split-res .sp-bar{font-size:40px;line-height:1.1}
.step-list{margin:0;padding-left:22px}
.step-list li{margin:4px 0}
.mini-steps{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px}
.mini-steps li{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:#F3EFFC;font-size:13px;font-weight:700;color:var(--ink-2)}
.mini-steps li span{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px}
.mini-steps li.cur{background:var(--c-stem);color:#fff}
.mini-steps li.cur span{color:var(--c-stem)}
.mini-steps li.done{background:#E8F7EF;color:#16804A}
.mini-steps li.done span::before{content:"✓"}
.mini-steps li.done span{font-size:0}
.mini-steps li.done span::before{font-size:12px}
.build-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.step-guide{margin-top:12px}
.step-guide .bubble{font-size:15px}
.build-plot{display:flex;justify-content:center;align-items:flex-start;padding:16px;border-radius:var(--radius);background:#FBFAFE;border:1.5px solid var(--line);min-height:260px;transition:min-height .4s}
.build-plot.rot{min-height:420px;align-items:center}
.rot-wrap{transition:transform .8s cubic-bezier(.3,.8,.3,1)}
.rot-wrap.rotated{transform:rotate(-90deg)}
.plot-title{font-weight:900;text-align:center}
.plot-note{text-align:right;font-size:14px;color:var(--ink-2);font-weight:700;min-height:20px}
.plot-note.set{color:var(--c-stem)}
.stemleaf.big{font-size:20px;min-width:240px}
.stemleaf.big td{padding:6px 12px;height:42px}
.stemleaf.big td.stem{width:56px}
.stem-in{width:40px;height:34px;text-align:center;font-size:18px;font-weight:800;border:1.5px solid var(--line);border-radius:8px}
.stem-in.bad{border-color:var(--bad);background:#FDECEE}
.leaf-d{display:inline-grid;place-items:center;width:24px;height:30px;font-weight:800;position:relative}
button.leaf-d{border:0;background:transparent;font-size:20px;cursor:pointer;border-radius:50%;width:30px;height:30px;padding:0}
.leaf-d.tap[aria-pressed=true]{box-shadow:inset 0 0 0 2.5px #D93A4A;color:#D93A4A}
.leaf-d.counted{background:#E8F7EF;color:#16804A}
.leaf-d.med{background:var(--c-stem);color:#fff}
.leaf-d.shake{animation:shake .4s}
.leaf-d sup{position:absolute;top:-8px;right:-6px;font-size:10px;color:var(--ink-2);font-weight:800}
.stemleaf td.leaf{letter-spacing:normal}
.stemleaf.input-mode td.leaf{padding:4px 8px}
.leaf-in{width:100%;min-width:180px;height:36px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;font-size:18px;letter-spacing:.3em}
.stemleaf tr.bad .leaf-in,.stemleaf tr.bad td.leaf{box-shadow:inset 0 0 0 2px var(--bad)}
.stemleaf tr.good .leaf-in{border-color:var(--ok)}
.stemleaf td.mark{font-weight:900;width:28px;text-align:center}
.stemleaf tr.bad td.mark{color:var(--bad)}
.stemleaf tr.good td.mark{color:var(--ok)}
.inline-in{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
details.help{margin-top:8px;padding:10px 14px;border-radius:var(--radius-xs);background:#F6F4FB}
details.help summary{cursor:pointer;font-weight:800}
details.help p{margin:6px 0 0}
.challenge{margin-top:14px;padding:14px 16px;border-radius:var(--radius-sm);background:#FFF8E1;border:1.5px dashed #F4B400}
.challenge p{margin:6px 0 0}
@media (max-width:1023px){ .build-grid{grid-template-columns:1fr} }
@media (max-width:767px){ .split-num{font-size:34px} .stemleaf.big{font-size:18px;min-width:0} .val-table td.val{min-width:44px;font-size:15px;padding:6px} }


/* ---------- 3. 도수분포표 ---------- */
.stemleaf.compact{font-size:15px}
.stemleaf.compact td{padding:1px 10px;height:auto}
.stemleaf.compact tr.empty td.stem{color:#B9B3C9}
.bins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.bin{border:2px solid #1E88E5;border-radius:var(--radius-sm);background:#fff;padding:10px;min-height:110px;display:flex;flex-direction:column;gap:6px}
.bin.bump{animation:bump .3s}
.bin-head{font-size:13px;font-weight:800;color:#1565C0;text-align:center;white-space:nowrap}
.tally{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:30px}
.tally-g{width:30px;height:30px}
.bin-num{font-size:22px;text-align:center;color:#1E88E5;min-height:28px}
.cell-in{min-height:36px;text-align:right;font-weight:800}
.cell-in.bad{border-color:var(--bad);background:#FDECEE}
.cell-in.good{border-color:var(--ok);background:#F1FBF5}
.freq-table td.cls{min-width:140px}
.flash{animation:flash 1.6s}
table.flash{animation:flashT 1.6s}
@keyframes flash{0%,40%,80%{background:#FFE082}20%,60%,100%{background:transparent}}
@keyframes flashT{0%,40%,80%{box-shadow:0 0 0 4px #FFC107}20%,60%,100%{box-shadow:none}}
.width-tag{margin-top:8px;padding:6px 12px;border-radius:10px;background:#FFF8E1;font-size:14px;animation:stageIn .3s}
.term{border:0;background:#FFF3C4;color:#7A4F00;font-weight:900;border-radius:6px;padding:1px 6px;cursor:pointer;font-size:inherit}
.term:hover{background:#FFE082}
.size-ctrl{display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end;margin-bottom:14px}
.size-ctrl label{display:flex;flex-direction:column;font-weight:700;font-size:14px}
.big-out{font-size:18px}
.range-ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);padding:0 6px 0 2px;margin-right:64px}
.cls-count{display:flex;flex-direction:column;align-items:center;padding:10px 16px;border-radius:var(--radius-sm);background:#F6F4FB;min-width:150px}
.cls-count span{font-size:13px;font-weight:700;color:var(--ink-2)}
.cls-count b{font-size:34px;font-weight:900;line-height:1.1}
.cls-count b.warn{color:var(--bad)}
.cls-count b.good{color:var(--ok)}
.cls-count small{font-size:12px;text-align:center;max-width:170px}
.scroll-y{max-height:320px;overflow:auto}
table.data tr.zero td{color:#B9B3C9}
.pick-row{cursor:pointer}
.pick-row:hover td{background:#F5FAFF}
.pick-row[aria-pressed=true] td{background:#E3F2FD;font-weight:800}
.blank{display:inline-grid;place-items:center;min-width:34px;height:28px;border-radius:8px;border:2px dashed var(--bad);color:var(--bad);font-weight:900}
.blank.filled{border-style:solid;border-color:var(--ok);color:var(--ok)}
.tool-tag{margin-top:10px;font-weight:800;font-size:14px}
.sum-tool{margin-top:4px;padding:10px 14px;border-radius:var(--radius-xs);background:#E3F2FD;font-size:15px}
td.acc{font-size:13px;color:#1565C0;font-weight:800;min-width:90px}
tr.acc-on td{background:#F1F8FF}
tr.acc-hit td{background:#FFE082!important}
@media (max-width:1023px){ .size-ctrl{grid-template-columns:1fr} .range-ticks{margin-right:64px} }
@media (max-width:767px){ .bins{grid-template-columns:repeat(3,minmax(0,1fr))} .bin-head{font-size:11px;white-space:normal} }


/* ---------- 4. 히스토그램과 도수분포다각형 ---------- */
.plane-wrap{background:#FBFAFE;border:1.5px solid var(--line);border-radius:var(--radius);padding:8px}
.plane-wrap.wide{max-width:820px}
.plane-svg{display:block;width:100%;height:auto;user-select:none}
.glow-table tr td{transition:background .3s}
.glow-table tr.glow td{background:#B2EBF2;font-weight:900}
.step-guide-txt{margin-top:10px;padding:10px 14px;border-radius:var(--radius-xs);background:#E0F7FA;font-size:15px;min-height:44px}
.aside-card{margin-top:14px;padding:12px 16px;border-radius:14px;background:#F6F4FB;border-left:4px solid var(--c-hist);font-size:15px}
.sentence{line-height:2.4;margin:0 0 8px}
.sentence .inline-sel{display:inline-block;width:auto;min-height:38px;padding:4px 10px;margin:0 4px;font-weight:700}


/* ---------- 5. 그래프 오류 탐정 ---------- */
.detective-hero{display:flex;gap:18px;align-items:center;padding:20px;border-radius:var(--radius);background:linear-gradient(135deg,#2B2140,#5B4BDB);color:#fff}
.detective-hero h3{font-size:22px;font-weight:900;margin-bottom:4px}
.detective-hero p{margin:0;opacity:.92}
.det-ico{font-size:56px;line-height:1}
.case-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.case-card{position:relative;min-height:130px;padding:14px;border-radius:var(--radius);border:2px solid #E0D7F5;background:#FFFDF6;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;text-align:left;overflow:hidden;transition:transform .15s}
.case-card::before{content:"";position:absolute;top:0;left:16px;width:60px;height:8px;background:#F4B400;border-radius:0 0 6px 6px}
.case-card:hover{transform:translateY(-3px)}
.case-card.solved{background:#F6FCF8;border-color:#BFE8CF}
.case-no{font-size:12px;font-weight:900;color:var(--c-play)}
.case-ico{font-size:28px;line-height:1}
.case-ico.big{font-size:40px}
.case-state{margin-top:auto;font-size:12px;color:var(--ink-2);font-weight:700}
.stamp{position:absolute;right:10px;bottom:10px;border:3px solid #D93A4A;color:#D93A4A;font-weight:900;font-size:16px;padding:2px 10px;border-radius:8px;transform:rotate(-14deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1);background:rgba(255,255,255,.7)}
.stamp.big{position:static;display:inline-block;font-size:24px;padding:4px 14px;flex:none}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:1}}
.case-room{margin-top:16px}
.case-open{border:2px solid var(--c-play);border-radius:var(--radius);padding:18px;background:#fff;animation:stageIn .3s}
.case-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.case-head h3{font-size:20px;font-weight:900}
.case-brief{margin:0 0 6px;font-weight:600}
.evidence{padding:12px;border-radius:var(--radius-sm);background:#FBFAFE;border:1.5px dashed #D9CFF2}
.spot{cursor:zoom-in;border-radius:var(--radius-xs);transition:box-shadow .15s,background .15s}
.spot:hover,.spot:focus-visible{box-shadow:0 0 0 3px rgba(255,92,138,.35)}
td.spot:hover{background:#FFF0F4}
.spot.found{box-shadow:0 0 0 4px #D93A4A!important;background:rgba(255,235,238,.6)}
.spot.nope{animation:shake .4s}
.spot-wrap{position:relative}
.spot.zone{position:absolute;border:0;background:transparent;padding:0}
.spot.zone:hover{background:rgba(255,92,138,.08)}
.spot.zone.found{background:rgba(217,58,74,.12)}
.hint-line{margin-top:8px;padding:8px 12px;border-radius:10px;background:#FFF8E1;font-weight:600;font-size:15px}
.case-msg{margin-top:10px}
.case-msg .quiz-feedback{margin-top:0}
.case-solved{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:14px;background:#E9F8F0;margin-top:10px}
.headline{font-size:18px;font-weight:700;background:#fff;border-radius:var(--radius-xs);padding:6px}
.headline .spot{display:inline-block;padding:8px 12px}
.notebook{display:grid;gap:8px;margin-top:12px;padding:16px;border-radius:var(--radius-sm);background:repeating-linear-gradient(#FFFDF6 0 38px,#EDE6D3 38px 39px);border:1.5px solid #EDE6D3}
.nb-line{display:flex;gap:10px;align-items:center;min-height:30px}
.nb-line.on{font-weight:800}
.nb-no{font-weight:900;color:var(--c-play);min-width:32px}
.challenge-box{margin-top:22px;padding:14px 16px;border-radius:var(--radius);background:#FFF8E1;border:1.5px dashed #F4B400}
.challenge-box summary{cursor:pointer;font-weight:900;font-size:17px}
.maker{display:grid;gap:10px;margin-top:8px}
.maker label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.maker .inline-in{flex-direction:row;align-items:center}
.maker .select{width:auto}
.code-box{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.progress.mini{height:12px;margin-top:12px;background:#EEE9F8}
.progress.mini > i{background:var(--c-play)}
@media (max-width:1023px){ .case-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }


/* ---------- 6. 상대도수 ---------- */
.rel-col{background:#FFF8E1}
.g50-row{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.grid50{display:grid;grid-template-columns:repeat(10,28px);grid-auto-rows:28px;gap:4px;padding:10px;border-radius:14px;background:#FBFAFE;border:1.5px solid var(--line)}
.g50{display:inline-block;width:28px;height:28px;border-radius:6px;background:var(--gc);animation:pop .3s both}
.g50.p1{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 3px,transparent 3px 7px)}
.g50.p2{background-image:radial-gradient(rgba(255,255,255,.7) 2px,transparent 2.5px);background-size:8px 8px}
.g50.p4{background-image:linear-gradient(rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.55) 2px,transparent 2px);background-size:8px 8px}
.g50-legend{display:grid;gap:8px;font-size:15px}
.g50-legend span{display:flex;align-items:center;gap:8px}
.g50-legend .g50{width:20px;height:20px;animation:none;flex:none}
.icon-box{display:grid;grid-template-columns:repeat(10,max-content);gap:5px;padding:8px 0;justify-content:center}
.pi{width:16px;height:22px;border-radius:8px 8px 4px 4px;background:#DDD7EA;position:relative}
.pi::before{content:"";position:absolute;left:3px;top:-9px;width:10px;height:10px;border-radius:50%;background:inherit}
.pi.on{background:var(--pc)}
.pi{margin-top:10px}
.morph{min-height:120px;display:flex;flex-direction:column;justify-content:center}
.pct-bar{display:flex;height:54px;border-radius:var(--radius-xs);overflow:hidden;border:2px solid var(--ink);background:#F1EEF8}
.pct-fill{width:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;white-space:nowrap;transition:width 1s cubic-bezier(.3,.9,.3,1)}
.pct-rest{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-weight:700}
.pct-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:4px}
.tf-list{display:grid;gap:8px}
.tf-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;border-radius:var(--radius-xs);background:#fff;border:1.5px solid var(--line)}
.tf-r{font-weight:900;font-size:18px;min-width:20px}
.tf-r.ok{color:var(--ok)}
.tf-r.no{color:var(--bad)}
.talk{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.talk-who{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.talk-who .guide-ava{width:52px;height:52px}
.talk-b{flex:1}
.talk-part{border:0;background:transparent;font:inherit;font-weight:700;padding:2px 2px;border-radius:6px;cursor:zoom-in;text-align:left;color:inherit}
.talk-part:hover{background:rgba(255,92,138,.12)}
.talk-part.found{background:#FFE3E8;text-decoration:underline wavy #D93A4A;text-underline-offset:4px}
.calc{margin:6px 0;padding:6px 10px;border-radius:8px;background:#fff;font-weight:800;color:var(--ink)}
@media (max-width:767px){ .g50-row{grid-template-columns:1fr} .grid50{grid-template-columns:repeat(10,22px);grid-auto-rows:22px} .g50{width:22px;height:22px} }


/* ---------- 7. 통계적 문제해결 프로젝트 ---------- */
.sc-wrap{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:16px}
.social-card{display:flex;gap:18px;align-items:flex-start;padding:22px;border-radius:var(--radius);background:linear-gradient(135deg,#F3F0FF,#E8FBFC);border:1.5px solid var(--line);min-height:190px;animation:stageIn .3s}
.sc-ico{font-size:52px;line-height:1}
.sc-no{font-size:12px;font-weight:900;color:var(--c-proj)}
.sc-body h3{font-size:21px;font-weight:900;margin:2px 0 8px}
.sc-stat{display:inline-block;padding:6px 12px;border-radius:10px;background:#fff;font-weight:900;font-size:18px}
.sc-stat.empty{color:var(--ink-2);font-weight:700;font-size:15px;border:1.5px dashed #CFC4EC}
.sc-q{font-weight:700;margin:10px 0 4px}

.sample-note{margin:0 0 12px;padding:10px 14px;border-radius:var(--radius-xs);background:#FFF3E0;border:1.5px solid #FFB74D;font-size:14px}
@media (max-width:1023px){ .proj-stepper{grid-template-columns:repeat(5,minmax(0,1fr))} .proj-stepper li button{flex-direction:column;text-align:center;font-size:12px;padding:6px 4px} .three-col{grid-template-columns:1fr} }

/* ---------- 7. 프로젝트 ③④⑤ ---------- */

.checklist{display:grid;gap:8px;align-content:start}
.rec-col{display:flex;flex-direction:column;gap:6px}

/* 탐구 보고서 포스터 (캔바 스타일) */
.poster-wrap{overflow-x:auto;padding:6px 0}

.poster-head{padding:22px 26px 18px;background:linear-gradient(120deg,#7D2AE8,#5B4BDB 55%,#00C4CC);color:#fff}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}

.flow-ar{color:#9A93B0;font-weight:900}
.poster-results{padding:14px 20px 0}
.poster-grid{display:grid;gap:12px}
.poster-grid.n2,.poster-grid.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.poster-grid.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.poster-item{position:relative;padding:12px 12px 10px;border-radius:var(--radius-sm);border:1.5px solid #EEE8FA;background:#fff;min-width:0}
.item-no{position:absolute;top:-8px;left:-6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#00C4CC;color:#fff;font-weight:900;font-size:13px}
.poster-item .interp{margin:6px 0;padding-left:18px;font-size:14px}

.eval-table td:first-child{text-align:left}
.ev-cell{text-align:center}
.ev-radio{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;cursor:pointer;position:relative}

.ev-radio span{font-size:22px;color:#CFC4EC;font-weight:900}
.ev-radio input:checked + span{color:var(--primary)}
.ev-radio input:focus-visible + span{outline:3px solid var(--secondary);border-radius:50%}
@media (max-width:767px){ .interp-card{grid-template-columns:1fr} .poster-steps,.poster-grid.n2,.poster-grid.n3,.poster-grid.n4{grid-template-columns:1fr} }

/* ---------- 마무리: 자료 분석 완료 ---------- */
.done-page{display:grid;gap:var(--gap)}

.done-hero .muted{color:rgba(255,255,255,.85)}
.done-kicker{display:inline-block;padding:2px 12px;border-radius:999px;background:rgba(255,255,255,.22);font-size:13px;font-weight:800}

/* ---------- 10. 점검: 그리드 자식이 내용 때문에 넘치지 않게 ---------- */
.build-grid > *,.done-page > *,.two-col > *,.three-col > *,.sum-grid > *,.find-list > *,.lab > *,.poster-grid > *,.interp-card > *,.stat-grid > *{min-width:0}
.done-page{grid-template-columns:minmax(0,1fr)}
/* ---------- 버튼·입력 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--primary);background:#fff;color:var(--primary);font-weight:700;cursor:pointer;transition:transform .08s,box-shadow .15s,background .15s;white-space:nowrap}
.btn{max-width:100%}
@media (max-width:767px){ .btn{white-space:normal;text-align:center;line-height:1.3;padding:8px 16px} }
.btn:hover{box-shadow:0 4px 12px rgba(125,42,232,.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:#fff}
.btn.ghost{border-color:transparent;background:#F3EFFC}
.btn.small{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.input,.select,textarea.input{min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:var(--radius-xs);background:#fff;width:100%}
.input:focus,.select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(125,42,232,.15)}
.range{display:flex;align-items:center;gap:12px}
.range input[type=range]{flex:1;height:44px;accent-color:var(--primary);cursor:pointer}
.range output{min-width:52px;text-align:center;font-weight:800;background:#F3EFFC;border-radius:10px;padding:4px 8px}
.seg{display:inline-flex;background:#F3EFFC;border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:transparent;font-weight:700;color:var(--ink-2);cursor:pointer}
.seg button[aria-selected=true]{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;font-weight:700}
.toggle input{width:22px;height:22px;accent-color:var(--primary)}

/* 끌어다 놓기 카드 */
.dnd-card{display:inline-flex;align-items:center;min-height:44px;padding:6px 16px;border-radius:14px;background:#fff;border:1.5px solid var(--line);box-shadow:var(--shadow);font-weight:700;cursor:grab;user-select:none;touch-action:none}
.dnd-card.picked{border-color:var(--primary);box-shadow:0 0 0 3px rgba(125,42,232,.25);transform:translateY(-2px)}
.dnd-card.dragging{opacity:.9;cursor:grabbing;position:fixed;z-index:200;pointer-events:none}
.dnd-slot{min-height:70px;border:2px dashed #CFC4EC;border-radius:var(--radius-sm);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:#FBFAFE;transition:background .15s}
.dnd-slot.over{background:#EFE6FD;border-color:var(--primary)}
.dnd-slot-title{font-weight:800;font-size:14px;margin-bottom:6px}

/* 하단 이동 */
.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:var(--gap)}

/* ---------- 표 ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{border-collapse:collapse;min-width:100%;font-size:15px}
table.data th,table.data td{border:1px solid var(--line);padding:8px 12px;white-space:nowrap}
table.data thead th{background:#F3EFFC;font-weight:800}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
table.data td.cls{text-align:center;white-space:nowrap}
table.data .unit-note{font-size:11px;color:var(--ink-2);display:flex;justify-content:space-between;max-width:7.5em;margin:0 auto;line-height:1.2}
table.data tfoot td{font-weight:800;background:#FBFAFE}

/* ---------- 그래프 ---------- */
.chart{position:relative;width:100%;min-height:220px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg.editing{touch-action:none}
.chart-tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .12s;z-index:5}
.chart-tip.show{opacity:1}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;font-weight:700;margin-top:6px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chart-title{font-weight:800;text-align:center;margin-bottom:4px}

/* ---------- 퀴즈 ---------- */
.quiz{border-radius:var(--radius-sm);background:#FBFAFE;padding:18px;border:1.5px solid var(--line)}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;color:var(--ink-2);font-size:14px}
.quiz-dots{display:flex;gap:6px}
.quiz-dots i{width:10px;height:10px;border-radius:50%;background:#DDD5F0}
.quiz-dots i.cur{background:var(--primary)}
.quiz-dots i.ok{background:var(--ok)}
.quiz-dots i.no{background:var(--bad)}

.guide-step .guide{gap:10px}

.val-btn{display:flex;justify-content:center;align-items:center;min-height:56px;padding:10px 16px;border:2px solid var(--c);color:var(--c);background:#fff;font-size:19px;font-weight:900}
.val-btn[aria-selected=true]{background:var(--c);color:#fff;border-color:var(--c)}
.val-btn:hover{transform:translateY(-1px)}
.val-frame{height:auto;min-height:360px;justify-content:flex-start;border-color:var(--c,var(--line))}
.val-frame .num-pool,.val-frame .num-line{min-height:64px}
.g-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.g-chip{min-width:44px;padding:10px 8px;border-radius:12px;background:#F5EEFF;text-align:center;font-weight:900;font-size:18px}
.val-area .g2col{margin-top:0}
[hidden]{display:none !important}
.mean-svg{width:100%;height:auto;display:block;touch-action:none}
.mean-line-g:focus-visible circle{stroke:#00C4CC;stroke-width:4}
.val-frame{border-color:#0E8F97}

.val-area .think-box .data th,.val-area .think-box .data td{white-space:normal;word-break:keep-all;padding:6px 8px;font-size:14px}
.wb-panel{margin-top:14px;padding:14px 16px;border-radius:var(--radius-sm);border:2px dashed var(--c,var(--primary));background:#FBFAFE;display:grid;gap:12px}
.wb-help{margin:0;font-weight:700;color:var(--ink-2)}
.wb-bank{display:flex;flex-wrap:wrap;gap:8px}
.wb-chip{min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid var(--c,var(--primary));background:#fff;color:var(--c,var(--primary));font:inherit;font-weight:800;cursor:pointer}
.wb-chip.sel{background:var(--c,var(--primary));color:#fff}
.wb-chip:disabled{opacity:.3;cursor:default}
.wb-def{line-height:2.1}
.wb-blank{display:inline-block;min-width:64px;min-height:32px;margin:0 3px;padding:0 8px;border:0;border-bottom:2.5px solid var(--c,var(--primary));border-radius:6px 6px 0 0;background:#F5EEFF;font:inherit;font-weight:900;color:var(--c,var(--primary));cursor:pointer;vertical-align:baseline}
.wb-blank.ok{background:#EFFAF3;color:#1E9E5A;border-color:#1E9E5A}
.wb-blank.no{background:#FFF1F2;color:#D93A4A;border-color:#D93A4A}
.wb-blank:focus-visible,.wb-chip:focus-visible{outline:3px solid var(--secondary);outline-offset:2px}
.wb-card .term-ex,.wb-card .term-use{display:none}
/* 소활동: 활동 테마색과 같은 계열의 옅은 색(위계) */
.stage-panel{--sk:color-mix(in srgb, var(--k) 62%, #fff);--skbg:color-mix(in srgb, var(--k) 8%, #fff)}
.subact-card{border-color:color-mix(in srgb, var(--k) 22%, #fff)}
.subact-card:hover{border-color:var(--sk)}
.subact-card[aria-selected=true]{border-color:var(--sk);background:var(--skbg);box-shadow:0 0 0 3px color-mix(in srgb, var(--k) 12%, transparent)}
.subact-no{background:var(--skbg);color:var(--k)}
.subact-card[aria-selected=true] .subact-no{background:var(--sk);color:#fff}
.subact-nav .btn{border-color:var(--sk);color:var(--k);background:#fff}
.subact-nav .btn.primary{background:var(--sk);border-color:var(--sk);color:#fff}
/* 활동 간 이동 버튼: 이동할 활동의 테마색 */
.stage-foot .btn{border-color:var(--k);color:var(--k);background:#fff}
.stage-foot .btn.primary{background:var(--k);border-color:var(--k);color:#fff}
.stage-foot .btn:hover{filter:brightness(.95)}
/* 3단계 위계: 활동(진한 테마색) → 소활동(옅은 색 --sk) → 세부 활동(더 옅은 색 --dk) */
.stage-panel{--dk:color-mix(in srgb, var(--k) 40%, #fff);--dkbg:color-mix(in srgb, var(--k) 5%, #fff);--dktx:color-mix(in srgb, var(--k) 78%, #000)}
.stage-panel .seg{background:var(--dkbg);border:1.5px solid color-mix(in srgb, var(--k) 16%, #fff)}
.stage-panel .seg button{color:var(--dktx)}
.stage-panel .seg button[aria-selected=true]{background:var(--dk);color:var(--dktx);box-shadow:none;font-weight:900}
.stage-panel .val-btn{border-color:var(--dk);color:var(--dktx);background:#fff}
.stage-panel .val-btn[aria-selected=true]{background:var(--dk);border-color:var(--dk);color:var(--dktx)}
.stage-panel .val-frame{border-color:var(--dk)}
.stage-panel .v-step .gs-no{background:var(--dk)!important;color:var(--dktx)}
/* 개념 카드: 주제 색 그대로, 카드 안 내용도 같은 색 계열 */
.term-card .term-ex{background:color-mix(in srgb, var(--c,var(--primary)) 7%, #fff)}
.term-card .term-use{background:color-mix(in srgb, var(--c,var(--primary)) 12%, #fff)}
.term-card .term-use b{color:var(--c,var(--primary))}
.term-card .term-name{color:color-mix(in srgb, var(--c,var(--primary)) 55%, #1F1A2E)}
.def-card .def-term{color:color-mix(in srgb, var(--c,var(--primary)) 60%, #1F1A2E)}
.def-card .def-ex{color:color-mix(in srgb, var(--c,var(--primary)) 45%, #5B5670)}
.stage-panel .feat-box{background:color-mix(in srgb, var(--c,var(--primary)) 8%, #fff)}
.stage-panel .feat-box .gal-tag{background:var(--c,var(--primary));color:#fff}
.stage-foot{margin-top:16px;padding-top:0;border-top:0}

/* ===== 위계 색 v2: 활동(--k) → 소활동(--s: 같은 계열, 색상만 살짝 돌린 구분색) → 세부 활동(--s 기반, 진한 글자) ===== */
.k-goal{--s:#B7791F}.k-open{--s:#1F7FC8}.k-concept{--s:#B8329A}.k-explore{--s:#5B8C12}.k-quiz{--s:#D23B4E}
.stage-panel{--sk:var(--s);--skbg:color-mix(in srgb, var(--s) 9%, #fff);
  --dk:color-mix(in srgb, var(--s) 45%, #fff);--dkbg:color-mix(in srgb, var(--s) 6%, #fff);--dktx:color-mix(in srgb, var(--s) 62%, #1F1A2E)}
.subact-card{border-color:color-mix(in srgb, var(--s) 28%, #fff)}
.subact-card .subact-title{color:color-mix(in srgb, var(--s) 55%, #1F1A2E)}
.subact-card[aria-selected=true]{border-color:var(--s);background:var(--skbg);box-shadow:0 0 0 3px color-mix(in srgb, var(--s) 16%, transparent)}
.subact-no{background:color-mix(in srgb, var(--s) 14%, #fff);color:var(--s)}
.subact-card[aria-selected=true] .subact-no{background:var(--s);color:#fff}
.subact-nav .btn{border-color:var(--s);color:var(--dktx);background:#fff}
.subact-nav .btn.primary{background:var(--s);border-color:var(--s);color:#fff}
/* 세부 활동 버튼: 가독성 — 흰/옅은 바탕 + 진한 글자 + 굵게 */
.stage-panel .seg{background:var(--dkbg);border:1.5px solid color-mix(in srgb, var(--s) 30%, #fff)}
.stage-panel .seg button{color:var(--dktx);font-weight:800;font-size:15.5px}
.stage-panel .seg button[aria-selected=true]{background:#fff;color:var(--dktx);font-weight:900;box-shadow:inset 0 0 0 2px var(--s),0 1px 3px rgba(0,0,0,.08)}
.stage-panel .val-btn{border:2px solid var(--dk);color:var(--dktx);background:#fff;font-weight:800;font-size:15.5px}
.stage-panel .val-btn:hover{border-color:var(--s)}
.stage-panel .val-btn[aria-selected=true]{background:color-mix(in srgb, var(--s) 16%, #fff);border-color:var(--s);color:var(--dktx);font-weight:900}
.stage-panel .val-frame{border-color:var(--dk)}
.stage-panel .v-step .gs-no{background:var(--s)!important;color:#fff}
/* 주제 간 이동: 마지막 활동의 활동 이동 버튼 아래 */
.topic-foot{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding-top:12px;border-top:1.5px dashed var(--line)}
.topic-foot .btn{border-color:var(--k);color:var(--k);background:#fff}
.topic-foot .btn.primary{background:var(--k);border-color:var(--k);color:#fff}
.topic-foot-label{display:none}

/* ===== 위계 색 v3: 소활동 = 활동 테마색(--k), 세부 활동 = 같은 계열 구분색(--s) / 활동 안 버튼 = 활동 테마색 ===== */
.subact-card{border-color:color-mix(in srgb, var(--k) 24%, #fff)}
.subact-card:hover{border-color:var(--k)}
.subact-card .subact-title{color:color-mix(in srgb, var(--k) 60%, #1F1A2E)}
.subact-card[aria-selected=true]{border-color:var(--k);background:var(--kbg);box-shadow:0 0 0 3px color-mix(in srgb, var(--k) 16%, transparent)}
.subact-no{background:color-mix(in srgb, var(--k) 14%, #fff);color:var(--k)}
.subact-card[aria-selected=true] .subact-no{background:var(--k);color:#fff}
.stage-panel .btn:not(.danger){border-color:var(--k);color:color-mix(in srgb, var(--k) 82%, #1F1A2E)}
.stage-panel .btn.primary:not(.danger){background:var(--k);border-color:var(--k);color:#fff}
.stage-panel .btn:hover{box-shadow:0 4px 12px color-mix(in srgb, var(--k) 22%, transparent)}
.stage-panel .btn.ghost{border-color:transparent;background:var(--kbg)}
.stage-panel .btn.picked{background:var(--kbg)}
.subact-nav .btn{border-color:var(--k);color:color-mix(in srgb, var(--k) 82%, #1F1A2E);background:#fff}
.subact-nav .btn.primary{background:var(--k);border-color:var(--k);color:#fff}
.stage-panel .mini-steps li{background:var(--dkbg);color:var(--dktx);border:1.5px solid color-mix(in srgb, var(--s) 25%, #fff)}
.stage-panel .mini-steps li.cur{background:var(--s);border-color:var(--s);color:#fff}
.stage-panel .mini-steps li.cur span{color:var(--s)}

/* ===== 위계 색 v3: 활동·소활동 = 활동 테마색(--k), 세부 활동 = 같은 계열 구분색(--s) ===== */
.stage-panel{--sk:var(--k);--skbg:color-mix(in srgb, var(--k) 8%, #fff)}
.subact-card{border-color:color-mix(in srgb, var(--k) 25%, #fff)}
.subact-card:hover{border-color:var(--k)}
.subact-card .subact-title{color:color-mix(in srgb, var(--k) 60%, #1F1A2E)}
.subact-card[aria-selected=true]{border-color:var(--k);background:var(--skbg);box-shadow:0 0 0 3px color-mix(in srgb, var(--k) 14%, transparent)}
.subact-no{background:color-mix(in srgb, var(--k) 12%, #fff);color:var(--k)}
.subact-card[aria-selected=true] .subact-no{background:var(--k);color:#fff}
/* 활동 안 버튼: 활동 테마색 */
.stage-panel .btn{border-color:var(--k);color:var(--k)}
.stage-panel .btn:hover{box-shadow:0 4px 12px color-mix(in srgb, var(--k) 22%, transparent)}
.stage-panel .btn.primary{background:var(--k);border-color:var(--k);color:#fff}
.stage-panel .btn.ghost{border-color:transparent;background:color-mix(in srgb, var(--k) 10%, #fff)}
.stage-panel .btn.picked{background:color-mix(in srgb, var(--k) 10%, #fff)}
.stage-panel .btn.danger{border-color:var(--bad);color:var(--bad)}
.stage-panel .btn.primary.danger{background:var(--bad);color:#fff}
/* 세부 활동 안의 버튼은 세부 활동 색 */
.stage-panel .val-frame .btn{border-color:var(--s);color:var(--s)}
.stage-panel .val-frame .btn.primary{background:var(--s);border-color:var(--s);color:#fff}
/* 활동 안 글박스: 활동 테마색 */
.stage-panel .bubble{background:color-mix(in srgb, var(--k) 8%, #fff)}
.stage-panel .reflect,.stage-panel .mini-q,.stage-panel .group-box{background:color-mix(in srgb, var(--k) 4%, #fff);border-color:color-mix(in srgb, var(--k) 28%, #fff)}
.stage-panel .think-box{background:color-mix(in srgb, var(--k) 6%, #fff);border-color:color-mix(in srgb, var(--k) 55%, #fff)}
.stage-panel .guide-step{border-color:color-mix(in srgb, var(--k) 28%, #fff)}
.stage-panel .gs-no{background:var(--k)}
/* 개념 카드: 모든 주제에서 복습 '상황에 맞는 그래프' 카드 색으로 통일 */
.term-card,.def-card{--c:#FF8A3D !important}

.stage-panel .concept-box{--c:var(--k) !important}
.stage-panel .chip{border-color:color-mix(in srgb, var(--k) 25%, #fff)}
.stage-panel .chip:hover{border-color:color-mix(in srgb, var(--k) 55%, #fff)}
.stage-panel .chip[aria-pressed=true]{border-color:var(--k);background:color-mix(in srgb, var(--k) 10%, #fff);color:color-mix(in srgb, var(--k) 70%, #1F1A2E)}
/* 세부 활동(평균·중앙값·최빈값) 영역 안: 버튼·글박스 모두 세부 활동 색 */
.stage-panel .val-pane{--k:var(--s)}
.stage-panel .val-pane .concept-box{--c:var(--s) !important}

/* 입력창·확인 버튼 오른쪽 정렬 */
.quiz-input-row:not(.no-right),.calc-row{justify-content:flex-end;flex-wrap:wrap}
.calc-row .btn-row{margin-left:0 !important}
.mini-q > .btn-row:has(> .input){justify-content:flex-end}
.calc-row-tg{display:flex;justify-content:flex-end;margin-top:8px}
/* 🧮 계산기 */
.calc-toggle.on{background:color-mix(in srgb, var(--k,var(--primary)) 12%, #fff)}
.calc-panel{position:fixed;right:20px;bottom:20px;z-index:300;width:272px;padding:12px;border-radius:16px;background:#fff;border:2px solid var(--k,var(--primary));box-shadow:0 12px 36px rgba(30,20,60,.22);display:grid;gap:8px}
.calc-head{display:flex;align-items:center;justify-content:space-between;color:var(--k,var(--primary))}
.calc-x{width:36px;height:36px;border:0;border-radius:50%;background:#F4F2F8;font-size:16px;cursor:pointer}
.calc-expr{min-height:20px;font-size:14px;color:var(--ink-2);text-align:right;word-break:break-all}
.calc-disp{font-size:28px;font-weight:900;text-align:right;padding:6px 10px;border-radius:10px;background:color-mix(in srgb, var(--k,var(--primary)) 7%, #fff);overflow-x:auto;white-space:nowrap}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-key{height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:19px;font-weight:800;cursor:pointer}
.calc-key:hover{background:#F7F5FB}
.calc-key.op{color:var(--k,var(--primary));border-color:color-mix(in srgb, var(--k,var(--primary)) 35%, #fff)}
.calc-key.fn{color:var(--bad)}
.calc-key:last-child{background:var(--k,var(--primary));color:#fff;border-color:var(--k,var(--primary))}
.calc-key:focus-visible,.calc-x:focus-visible{outline:3px solid var(--secondary);outline-offset:1px}
.calc-put{width:100%}
@media (max-width:767px){ .calc-panel{left:10px;right:10px;bottom:10px;width:auto} }
@media print{ .calc-panel,.calc-toggle,.calc-row-tg{display:none!important} }
/* 대푯값-생각 열기 표: 수 가운데 정렬 */
.flower-table td.num,.flower-table th{text-align:center !important}
.calc-head{cursor:move;touch-action:none}
.calc-panel .btn.primary{background:var(--k,var(--primary));border-color:var(--k,var(--primary));color:#fff}
.calc-toggle{flex:none}

/* 대푯값 비교: 탐구하기/계산하기 버튼은 2열, 1열 활동 영역 아래쪽 높이 */
.val-pane{grid-template-areas:"frame side" "extra btns";row-gap:14px}
.val-pane .vp-frame{grid-area:frame}.val-pane .vp-side{grid-area:side}.val-pane .vp-extra{grid-area:extra}
.val-pane .vp-btns{grid-area:btns;justify-content:flex-end;align-self:start;margin:0;flex-wrap:wrap}
.val-pane .vp-extra > .inner-sec{margin-top:0}
@media (max-width:767px){ .val-pane{grid-template-areas:"frame" "btns" "side" "extra"} }
/* 최빈값 점 도표 분류 */
.mode-plot{margin-top:8px}
.mode-svg{width:100%;height:auto;display:block;touch-action:none}
.mode-col{cursor:pointer;outline:none}
.mode-col-bg{fill:transparent;stroke:transparent}
.mode-col:hover .mode-col-bg,.mode-col:focus-visible .mode-col-bg,.mode-col.over .mode-col-bg{fill:color-mix(in srgb, var(--s,#B33BC9) 10%, #fff);stroke:color-mix(in srgb, var(--s,#B33BC9) 45%, #fff);stroke-dasharray:5 4}
.mode-svg.judge .mode-col-bg{stroke:color-mix(in srgb, var(--s,#B33BC9) 25%, #fff);stroke-dasharray:4 4}
.mode-dot{pointer-events:none;fill:#7D2AE8;stroke:#fff;stroke-width:2;animation:dotIn .25s ease-out}
.mode-dot.hi{fill:#D93A4A}
@keyframes dotIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.num-card.sel{outline:3px solid var(--s,#B33BC9);outline-offset:2px;transform:translateY(-3px)}
.num-card.used{opacity:.3;cursor:default}
.mode-msg{margin:10px 0 0;font-weight:600}
.cmp-sec{margin-top:22px}
@media (prefers-reduced-motion:reduce){ .mode-dot{animation:none} }

.vp-extra .chart{min-height:0}
.vp-extra .stat-grid.small .stat small{font-size:12.5px}
.vp-extra .stat-grid.small .stat b{font-size:16px}
.vp-extra .stat-grid.small .stat{text-align:center}

/* 최빈값 분류 활동: 결과가 나와도 활동 영역 높이가 변하지 않게 자리를 미리 확보 */

/* 2열 활동 배치 */

.act-frame > .btn{display:flex;width:fit-content;margin-left:auto}

.ask-head{margin:0 0 12px}

.subact-title{white-space:pre-line}
/* 글박스 안 변량은 가운데 정렬 */
.data-strip > div:not(.muted),.data-strip > span:not(.muted){text-align:center}

.v-strip{justify-content:center}
.dnd-slot-title{text-align:center}
/* 상황에 맞는 대푯값: 상황 카드와 질문 카드를 같은 줄에 같은 높이로 */
.sit-rows{display:grid;gap:14px;margin-top:14px}
.sit-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:stretch}
.sit-row > .sit-card,.sit-row > .sit-ask{margin:0;height:100%;box-sizing:border-box}
.sit-row > .sit-card{border:2px solid color-mix(in srgb, var(--k) 38%, #fff);justify-content:flex-start}
.sit-ask{align-content:start}
.sit-opts{justify-content:flex-end;display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;margin-top:10px}

.sit-opt.right{border-color:var(--ok)!important;background:#EAF8F0!important;color:#11663A!important}
.sit-opt.wrong{border-color:var(--bad)!important;background:#FDECEE!important;color:#9A1F2D!important}

/* 변량의 단위 표기는 오른쪽 정렬 */
.data-strip .muted{text-align:right !important}
.unit-r{text-align:right}
/* 그림판 */
.sketch{display:grid;gap:6px;margin-top:6px}

.sketch-area{position:relative;border:1.5px dashed color-mix(in srgb, var(--k,var(--primary)) 40%, #fff);border-radius:var(--radius-sm);background:#FBFAFE;overflow:hidden}

.sk-vals{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:22px 8px;padding:22px 14px;font-size:22px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.sk-cards{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;padding:14px 10px}

@media (max-width:767px){ .sk-cards{grid-template-columns:repeat(6,minmax(0,1fr))} .sk-vals{grid-template-columns:repeat(7,minmax(0,1fr));font-size:18px;gap:16px 4px} }
/* 평균·중앙값·최빈값 입력을 한 줄씩 */
.pm-inputs.rows{display:grid !important;grid-template-columns:1fr !important;gap:8px}

.guide-step .btn-row:not(:has(> :not(.btn))):has(> .btn + .btn) > .btn{width:100% !important;min-width:110px}
.pm-inputs.rows{grid-template-columns:max-content minmax(0,1fr) !important;align-items:center;column-gap:10px}

.guide-step .chip-row,.mini-q .chip-row,.mini-q > .btn-row,.vq .btn-row{justify-content:flex-end}

.mk-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;border-radius:var(--radius-xs);background:#F6F4FB}

.mk-plot .leaf-d{display:inline-block;margin-right:.35em}

<script>
/* =========================================================
   0. 캔바 이미지 자산 자리
   - 캔바에서 내보낸 PNG를 data: 주소(data:image/png;base64,...)로 넣으세요.
     (Claude 미리보기에서는 외부 이미지 주소가 열리지 않습니다)
   - 비어 있으면 기본 SVG 그림과 이모지로 대신합니다.
   ========================================================= */
const ASSETS = { banner: '', guideA: '', guideB: '', badge: '', icons: {} };

/* 선생님 모드 비밀번호 (수업 전에 바꾸세요) */
const TEACHER_PASSWORD = '1234';

/* =========================================================
   1. 학습 목록
   ========================================================= */
const LESSONS = [
  { id:0, key:'review', title:'초등학교에서 배운 그래프와 평균', short:'복습', color:'var(--c-review)', hex:'#FF8A3D', icon:'📊',
    goal:'초등학교에서 배운 여러 가지 그래프와 평균을 다시 떠올리고, 목적에 맞는 그래프를 고를 수 있다.' },

    goal:'자료를 도수분포표로 나타내고 해석할 수 있다.' },
  { id:4, key:'hist', title:'히스토그램과 도수분포다각형', short:'히스토그램', color:'var(--c-hist)', hex:'#00A3AD', icon:'📶',
    goal:'자료를 히스토그램과 도수분포다각형으로 나타내고 해석할 수 있다.' },
  { id:5, key:'play', title:'놀이: 그래프 오류 탐정', short:'놀이', color:'var(--c-play)', hex:'#FF5C8A', icon:'🕵️',
    goal:'잘못 만든 표와 그래프를 찾아 그 이유를 설명할 수 있다.' },
  { id:6, key:'rel', title:'상대도수와 그 그래프', short:'상대도수', color:'var(--c-rel)', hex:'#F4B400', icon:'⚖️',
    goal:'상대도수를 구하고, 그 분포를 표나 그래프로 나타내고 해석할 수 있다. 상대도수를 이용하여 두 자료의 분포를 비교할 수 있다.' },
  { id:7, key:'proj', title:'통계적 문제해결 프로젝트', short:'프로젝트', color:'var(--c-proj)', hex:'#5B4BDB', icon:'🚀',
    goal:'통계적 탐구 문제를 설정하고 자료를 수집·분석하여 그 결과를 해석할 수 있다.' }

const LAB = { key:'lab', title:'자료 실험실', color:'var(--c-lab)', hex:'#00C4CC', icon:'🧪' };

/* 공통 팔레트(그래프 여러 자료용) — 색 + 선 모양 + 표식을 함께 바꿉니다 */
const SERIES_STYLES = [
  { color:'#7D2AE8', dash:'',      marker:'circle', pattern:'' },
  { color:'#00A3AD', dash:'7 5',   marker:'square', pattern:'hatch' },
  { color:'#FF8A3D', dash:'2 4',   marker:'triangle', pattern:'dots' },
  { color:'#2BB673', dash:'10 4 2 4', marker:'diamond', pattern:'cross' }
];

/* =========================================================
   2. 저장소 (막혀 있으면 메모리에만 보관)
   ========================================================= */
const store = (() => {
  const KEY = 'naneun-jaryo-bunseokga-v1';
  let mem = null, ok = true;
  const blank = () => ({ completed:{}, scores:{}, findings:{}, teacher:false, lab:null, lessonData:{} });
  function load(){
    if (mem) return mem;
    try { const raw = localStorage.getItem(KEY); mem = raw ? Object.assign(blank(), JSON.parse(raw)) : blank(); }
    catch(e){ ok = false; mem = blank(); }
    return mem;
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){ ok = false; } }
  return {
    get state(){ return load(); },
    set(fn){ load(); fn(mem); save(); },
    reset(){ mem = blank(); try{ localStorage.removeItem(KEY); }catch(e){} },
    get persistent(){ load(); return ok; }
  };
})();

/* =========================================================
   3. 작은 도우미
   ========================================================= */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object'){ for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv; } }
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
/* Claude 미리보기처럼 다른 페이지 안(샌드박스 프레임)에서 열렸는지: 인쇄·다운로드가 막혀 있어 호출하면 콘솔 오류가 납니다 */
const FRAMED = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
function printWith(cls, what){
  if (FRAMED){
    modal(close => h('div', {}, h('h3', { id:'modalTitle' }, '🖨️ 여기서는 인쇄할 수 없어요'),
      h('p', {}, `Claude 미리보기 화면에서는 인쇄·PDF 저장이 막혀 있어요. 앱의 HTML 파일을 크롬 같은 브라우저에서 직접 열고 [${what}] 버튼을 누르면 A4로 인쇄하거나 PDF로 저장할 수 있어요.`),
      h('div', { class:'btn-row', style:{ justifyContent:'flex-end' } }, h('button', { class:'btn primary', onclick: close }, '확인'))));
    return;
  }
  document.body.classList.add(cls);
  try { window.print(); } catch(e){ document.body.classList.remove(cls); toast('인쇄 창을 열지 못했어요'); }
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs={}, ...kids){
  const el = document.createElementNS(SVGNS, tag);
  for (const [k,v] of Object.entries(attrs||{})) if (v != null) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
function toast(msg, ms=2200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), ms);
}
function modal(build){
  const back = $('#modalBack'), box = $('#modal');
  box.innerHTML = '';
  const close = () => { back.classList.remove('show'); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  box.append(build(close));
  back.classList.add('show');
  document.addEventListener('keydown', esc);
  back.onclick = e => { if (e.target === back) close(); };
  setTimeout(()=>{ const f = box.querySelector('input,button'); f && f.focus(); }, 30);
  return close;
}

/* 안내자 캐릭터(기본 SVG) — ASSETS.guideA가 있으면 그 이미지를 씁니다 */
function guideAvatar(which='A'){
  const src = which === 'A' ? ASSETS.guideA : ASSETS.guideB;
  if (src) return h('img', { src, alt:'안내자', class:'guide-ava', style:{objectFit:'contain'} });
  const body = which === 'A' ? '#7D2AE8' : '#00A3AD';
  const svg = s('svg', { viewBox:'0 0 64 64', class:'guide-ava', 'aria-hidden':'true' },
    s('circle', { cx:32, cy:34, r:26, fill:body }),
    s('circle', { cx:32, cy:30, r:17, fill:'#fff' }),
    s('circle', { cx:26, cy:29, r:3, fill:'#1F1A2E' }),
    s('circle', { cx:38, cy:29, r:3, fill:'#1F1A2E' }),
    s('path', { d:'M26 36 Q32 41 38 36', stroke:'#1F1A2E', 'stroke-width':2.5, fill:'none', 'stroke-linecap':'round' }),
    s('rect', { x:20, y:4, width:6, height:12, rx:3, fill:'#FFD166' }),
    s('rect', { x:29, y:1, width:6, height:15, rx:3, fill:'#FF8A3D' }),
    s('rect', { x:38, y:7, width:6, height:9, rx:3, fill:'#2BB673' })
  );
  return svg;
}
function brandLogo(){
  return s('svg', { viewBox:'0 0 40 40', width:28, height:28, 'aria-hidden':'true' },
    s('rect', { x:7, y:20, width:6, height:12, rx:2, fill:'#00C4CC' }),
    s('rect', { x:16, y:12, width:6, height:20, rx:2, fill:'#7D2AE8' }),
    s('rect', { x:25, y:16, width:6, height:16, rx:2, fill:'#FF8A3D' }),
    s('circle', { cx:27, cy:12, r:7, fill:'none', stroke:'#1F1A2E', 'stroke-width':2.5 }),

}

/* =========================================================
   4. 통계 계산 (stats)
   ========================================================= */
const stats = {
  /* 부동소수점 오류 정리: 0.1+0.2 → 0.3 */
  clean(x){ if (typeof x !== 'number' || !isFinite(x)) return x; return Number(Math.round(x * 1e10) / 1e10); },
  round(x, digits=1){ const p = Math.pow(10, digits); return stats.clean(Math.round(stats.clean(x) * p) / p); },
  fmt(x, digits){ if (typeof x !== 'number') return String(x); const v = digits == null ? stats.clean(x) : stats.round(x, digits); return v.toLocaleString('ko-KR', { maximumFractionDigits: 10 }); },
  /* 문자열 → 변량 배열 (쉼표·띄어쓰기·줄바꿈) */
  parse(text, { allowText = true } = {}){
    return String(text||'').split(/[\s,，、;]+/).map(t => t.trim()).filter(Boolean)
      .map(t => { const n = Number(t); return isFinite(n) && t !== '' ? n : (allowText ? t : null); })
      .filter(v => v !== null);
  },
  isNumeric(arr){ return arr.length > 0 && arr.every(v => typeof v === 'number'); },
  sum(arr){ return stats.clean(arr.reduce((a,b)=>a+b,0)); },
  mean(arr, digits){ if (!stats.isNumeric(arr)) return null; const m = stats.sum(arr) / arr.length; return digits == null ? stats.clean(m) : stats.round(m, digits); },
  sort(arr){ return [...arr].sort((a,b)=> typeof a === 'number' && typeof b === 'number' ? a-b : String(a).localeCompare(String(b),'ko')); },
  median(arr){
    if (!stats.isNumeric(arr)) return null;
    const a = stats.sort(arr), n = a.length, mid = Math.floor(n/2);
    return n % 2 ? a[mid] : stats.clean((a[mid-1] + a[mid]) / 2);
  },
  /* 최빈값: 여러 개면 모두, 모든 값이 같은 횟수면 [] (‘없음’) */
  modes(arr){
    if (!arr.length) return [];
    const cnt = new Map(); arr.forEach(v => cnt.set(v, (cnt.get(v)||0) + 1));
    const max = Math.max(...cnt.values());
    if (cnt.size > 1 && [...cnt.values()].every(c => c === max)) return [];
    if (cnt.size === 1 && arr.length === 1) return [arr[0]];
    return stats.sort([...cnt.entries()].filter(([,c]) => c === max).map(([v]) => v));
  },
  modesText(arr){ const m = stats.modes(arr); return m.length ? m.map(v => stats.fmt(v)).join(', ') : '없음'; },
  min(arr){ return stats.isNumeric(arr) ? Math.min(...arr) : null; },
  max(arr){ return stats.isNumeric(arr) ? Math.max(...arr) : null; },
  counts(arr){ const cnt = new Map(); arr.forEach(v => cnt.set(v, (cnt.get(v)||0)+1)); return cnt; },
  /* 줄기와 잎: unit=10 이면 십의 자리가 줄기, 일의 자리가 잎. unit=1 이면 일의 자리 줄기, 소수 첫째 자리 잎 */
  stemLeaf(arr, unit = 10){
    if (!stats.isNumeric(arr)) return [];
    const leafUnit = unit / 10;
    const items = arr.map(v => { const r = Math.round(v / leafUnit); return { stem: Math.floor(r / 10), leaf: ((r % 10) + 10) % 10 }; });
    const lo = Math.min(...items.map(i=>i.stem)), hi = Math.max(...items.map(i=>i.stem));
    const rows = [];
    for (let st = lo; st <= hi; st++) rows.push({ stem: st, leaves: items.filter(i=>i.stem===st).map(i=>i.leaf).sort((a,b)=>a-b) });
    return rows;
  },
  /* 도수분포표: start부터 size 간격, 가장 큰 변량이 들어갈 때까지 */
  freqTable(arr, start, size){
    if (!stats.isNumeric(arr) || !(size > 0)) return [];
    const mx = Math.max(...arr);
    const rows = [];
    for (let a = start; a <= mx; a = stats.clean(a + size)) {
      const b = stats.clean(a + size);
      rows.push({ from: a, to: b, count: arr.filter(v => v >= a && v < b).length });
      if (rows.length > 60) break;
    }
    return rows;
  },
  relFreq(rows){
    const total = rows.reduce((t,r)=>t+r.count,0);
    return rows.map(r => Object.assign({}, r, { rel: total ? stats.round(r.count / total, 4) : 0 }));
  },
  niceStart(arr, size){ return stats.isNumeric(arr) ? stats.clean(Math.floor(Math.min(...arr) / size) * size) : 0; }
};

/* =========================================================
   5. 공통 부품 1: 그래프 그리기 createChart(container, config)
   config = {
     type: 'bar'|'line'|'pie'|'band'|'pictograph'|'dot'|'histogram'|'polygon'|'histogram+polygon',
     labels: ['사과',...]            // bar·line·pie·band·pictograph 항목 이름
     edges: [4,8,12,16,20,24]        // histogram·polygon 계급의 양 끝 값
     series: [{ name, values:[...], color?, dash?, marker? }],

/* =========================================================
   6. 공통 부품 2: 자료 입력 createDataInput(container, options)
   options = { values:[], allowText:true, onChange(values), rows: 기본 빈 줄 수 }
   ========================================================= */
function createDataInput(container, options = {}){
  const opt = Object.assign({ values: [], allowText: true, rows: 10, onChange: () => {} }, options);
  let values = opt.values.slice(), mode = 'paste';
  const root = h('div', { class:'data-input' });

  const bPaste = h('button', { role:'tab', 'aria-selected':'true' }, '붙여 넣기');
  const bTable = h('button', { role:'tab', 'aria-selected':'false' }, '표에 입력');
  tabs.append(bPaste, bTable);
  const area = h('textarea', { class:'input', rows: 6, placeholder:'예) 24, 20, 22, 23, 26\n쉼표·띄어쓰기·줄바꿈으로 구분해요.', 'aria-label':'자료 붙여 넣기' });
  const tableBox = h('div', { class:'di-table', style:{ display:'none' } });

  root.append(tabs, area, tableBox, count);
  container.append(root);

  function emit(silent){ count.textContent = `변량의 개수: ${values.length}개` + (values.length && !stats.isNumeric(values) ? ' (수가 아닌 자료가 있어요)' : ''); if (!silent) opt.onChange(values.slice()); }
  function renderTable(){

    const n = Math.max(opt.rows, values.length + 3);
    for (let i = 0; i < n; i++){
      const inp = h('input', { value: values[i] != null ? values[i] : '', inputmode: opt.allowText ? 'text' : 'decimal', 'aria-label': `${i+1}번 자료` });
      inp.addEventListener('input', () => { collect(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); const next = tb.querySelectorAll('input')[i+1]; if (next) next.focus(); else { renderTable(); setTimeout(()=> tableBox.querySelectorAll('input')[i+1]?.focus(), 0); } } });
      tb.append(h('tr', {}, h('td', {}, i + 1), h('td', {}, inp)));
    }
    tableBox.append(h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'No.'), h('th', {}, '자료'))), tb));
  }
  function collect(){
    values = $$('input', tableBox).map(i => i.value.trim()).filter(Boolean).map(t => { const n = Number(t); return isFinite(n) ? n : t; }).filter(v => opt.allowText || typeof v === 'number');

  bPaste.onclick = () => setMode('paste'); bTable.onclick = () => setMode('table');
  area.value = values.join(', ');
  emit(true);
  return {
    getValues: () => values.slice(),
    setValues(v){ values = v.slice(); area.value = values.join(', '); if (mode === 'table') renderTable(); emit(); },
    el: root
  };
}

function auditQuiz(lessonId, questions){

    if (q.type === 'choice' && q.gen){ const ok = q.options.includes(q.answer) && new Set(q.options).size === q.options.length; if (!ok) QUIZ_AUDIT.push({ where: `${lessonId}. 퀴즈(새 문제)`, label: q.question, how:'보기에 정답이 하나', shown: q.answer, calc: q.options.join('/'), ok:false }); return; }

    const list = (t.match(/^([\d.]+(?:,\s*[\d.]+){2,})/) || [])[1];
    if (list){ const v = list.split(/,\s*/).map(Number);
      if (/평균/.test(t)){ calc = stats.mean(v); how = '평균'; } else if (/중앙값/.test(t)){ calc = stats.median(v); how = '중앙값'; } else if (/최빈값/.test(t)){ const m = stats.modes(v); calc = m.length === 1 ? m[0] : m.join(','); how = '최빈값'; } }
    let m;
    if (calc == null && (m = t.match(/([\d.]+) 이상 ([\d.]+) 미만인 계급의 크기/))){ calc = stats.clean(m[2] - m[1]); how = '계급의 크기'; }
    if (calc == null && (m = t.match(/총합이 ([\d.]+)이고 어떤 계급의 도수가 ([\d.]+)/))){ calc = stats.clean(m[2] / m[1]); how = '도수 ÷ 총합'; }
    if (calc == null && (m = t.match(/상대도수가 ([\d.]+)이고 도수의 총합이 ([\d.]+)/))){ calc = stats.clean(m[1] * m[2]); how = '상대도수 × 총합'; }
    if (calc == null && /상대도수를 모두 더하면/.test(t)){ calc = 1; how = '상대도수의 합'; }
    if (calc == null && !q.gen && q.data && /30점 미만/.test(t) && typeof MATH !== 'undefined'){ calc = MATH.volley.filter(v => v < 30).length; how = '줄기와 잎에서 세기'; }
    if (calc == null && !q.gen && q.data && /최빈값/.test(t) && typeof MATH !== 'undefined'){ calc = stats.modesText(MATH.volley); how = '줄기와 잎 최빈값'; }
    if (calc == null && !q.gen && q.data && /72 cm 이상/.test(t) && typeof MATH !== 'undefined'){ calc = MATH.otF[3] + MATH.otF[4]; how = '히스토그램 읽기'; }
    if (calc == null && q.gen && q.data && q.data.table && /미만인 변량은 몇 개/.test(t)){ const vals = q.data.table.rows.flatMap(r => String(r[1]).split(/\s+/).filter(Boolean).map(l => Number(r[0]) * 10 + Number(l))); const cut = Number((t.match(/에서 (\d+)/) || [])[1]); calc = vals.filter(v => v < cut).length; how = '줄기와 잎에서 세기(새 문제)'; }
    if (calc == null && q.gen && q.data && q.data.table && /최빈값/.test(t)){ const vals = q.data.table.rows.flatMap(r => String(r[1]).split(/\s+/).filter(Boolean).map(l => Number(r[0]) * 10 + Number(l))); const m = stats.modes(vals); calc = m.length === 1 ? m[0] : m.join(','); how = '줄기와 잎 최빈값(새 문제)'; }
    if (calc == null && q.gen && q.data && q.data.type === 'histogram' && /이상인 것은 모두/.test(t)){ const e0 = Number((t.match(/히스토그램에서 ([\d.]+)/) || [])[1]); calc = q.data.series[0].values.filter((_, i) => q.data.edges[i] >= e0).reduce((x, y) => x + y, 0); how = '히스토그램 읽기(새 문제)'; }
    if (calc == null) return;
    if (QUIZ_AUDIT.some(a => a.where === lessonId && a.label === t)) return;
    QUIZ_AUDIT.push({ where: `${lessonId}. 퀴즈`, label: t, how, shown: q.answer, calc, ok: String(q.answer) === String(calc) });
  });
}

function simpleTable(t){

  const head = exM ? [t.head[0], '잎', ...t.head.slice(2)] : t.head;
  const wrap = h('div', { class:'table-wrap' }, h('table', { class:'data' + (stemQ ? ' stem-q' : '') },

    h('tbody', {}, t.rows.map((r, ri) => h('tr', {}, r.map((c, ci) => h('td', { class: (typeof c === 'number' ? 'num' : 'cls') + (stemQ && ci === 1 ? ' leaf-q' : '') }, typeof c === 'number' ? stats.fmt(c) : c, ri === 0 && ci === 0 && /^\s*[\d.]+\s*~/.test(String(c)) ? unitNote() : null)))))));

function createStepper(steps, { onStep } = {}){
  let i = 0;
  const label = h('div', { style:{ fontWeight:700 } });
  const prevB = h('button', { class:'btn small' }, '처음부터');

  const el = h('div', { class:'btn-row' }, prevB, nextB, label);
  const go = n => { i = Math.max(0, Math.min(steps.length - 1, n)); label.textContent = `${i+1} / ${steps.length} · ${steps[i]}`; nextB.disabled = i === steps.length - 1; onStep && onStep(i); };
