function createDnD(container, { cards, slots, onChange }){
  const pool = h('div', { class:'dnd-slot', 'data-slot':'__pool' });
  const slotEls = {};
  const grid = h('div', { style:{ display:'grid', gridTemplateColumns:`repeat(auto-fit,minmax(160px,1fr))`, gap:'12px', marginTop:'12px' } });
  slots.forEach(sl => { const el = h('div', { class:'dnd-slot', 'data-slot': sl.id, tabindex:'0', role:'button', 'aria-label': sl.label + ' 자리' }); slotEls[sl.id] = el; grid.append(h('div', {}, h('div', { class:'dnd-slot-title' }, sl.label), el)); });
  container.append(h('div', { class:'dnd-slot-title' }, '카드'), pool, grid);
  let picked = null;
  const place = (card, slotEl) => { slotEl.append(card); card.classList.remove('picked'); picked = null; report(); };
  const report = () => { const map = {}; Object.entries(slotEls).forEach(([k, el]) => map[k] = $$('.dnd-card', el).map(c => c.dataset.id)); onChange && onChange(map); };
  cards.forEach(c => {
    const card = h('div', { class:'dnd-card', 'data-id': c.id, tabindex:'0', role:'button' }, c.label);
    pool.append(card);
    card.addEventListener('click', e => { e.stopPropagation(); if (picked && picked !== card && card.parentNode !== picked.parentNode){ place(picked, card.parentNode); return; } if (picked === card){ card.classList.remove('picked'); picked = null; return; } $$('.dnd-card.picked', container).forEach(x => x.classList.remove('picked')); picked = card; card.classList.add('picked'); });
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); card.click(); } });
    card.addEventListener('pointerdown', e => {
      if (e.button) return;
      const sx = e.clientX, sy = e.clientY; let ghost = null, over = null;
      const mm = ev => {
        if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
        if (!ghost){ ghost = card.cloneNode(true); ghost.classList.add('dragging'); document.body.append(ghost); card.style.opacity = .3; }
        ghost.style.left = (ev.clientX - 30) + 'px'; ghost.style.top = (ev.clientY - 20) + 'px';
        const t = document.elementFromPoint(ev.clientX, ev.clientY); const sl = t && t.closest('.dnd-slot');
        if (over && over !== sl) over.classList.remove('over'); over = sl; sl && sl.classList.add('over');
      };
      const up = () => { window.removeEventListener('pointermove', mm); window.removeEventListener('pointerup', up); if (ghost){ ghost.remove(); card.style.opacity = ''; if (over){ over.classList.remove('over'); place(card, over); } } };
      window.addEventListener('pointermove', mm); window.addEventListener('pointerup', up);
    });
  });

  return { getPlacement(){ const map = {}; Object.entries(slotEls).forEach(([k, el]) => map[k] = $$('.dnd-card', el).map(c => c.dataset.id)); return map; } };
}

      h('span', { class:'subact-no', 'aria-hidden':'true' }, no),

      i < secs.length - 1 ? h('button', { class:'btn small primary', onclick: () => show(i + 1, true) }, `다음 소활동 ${'①②③④⑤⑥⑦⑧⑨⑩'[i + 1] || ''} ▶`) : h('span', { class:'muted', style:{ fontSize:'14px' } }, '마지막 소활동이에요')));

const LESSON_BUILDERS = {};

function renderLesson(view, L){
  view.append(lessonHead({ color: L.color, icon: L.icon, eyebrow: `${L.id}. ${L.short}`, title: L.title, lid: L.id }));
  const st = store.state;
  const seen = (st.lessonData[L.id] && st.lessonData[L.id].seen) || {};
  let current = (st.lessonData[L.id] && st.lessonData[L.id].open) || 'goal';

  // 1) 단계 카드 격자
  const grid = h('div', { class:'stage-grid', role:'tablist', 'aria-label':'학습 단계', style:{ '--c': L.color } });
  // 2) 펼친 카드 자리
  const stage = h('div', { class:'stage-panel-wrap', style:{ '--c': L.color } });
  view.append(grid, stage);

  const STG = STAGES.filter(S => !S.optional || CONCEPTS[L.id]);
  grid.style.setProperty('--n', STG.length);
  const tiles = {}, panels = {}, bodies = {}, feet = {};
  STG.forEach((S, i) => {
    const tile = h('button', { class:`stage-tile k-${S.kind}`, role:'tab', id:`tab-${L.id}-${S.kind}`, 'aria-controls':`panel-${L.id}-${S.kind}`, 'aria-selected':'false' },
      h('span', { class:'stage-num' }, i + 1),
      h('span', { class:'stage-ico', 'aria-hidden':'true' }, S.icon),
      h('span', { class:'stage-label' }, S.label),
      h('span', { class:'stage-hint' }, S.hint),
      h('span', { class:'stage-check', 'aria-hidden':'true' }, '✓'));
    tile.onclick = () => open(S.kind, true);
    tile.addEventListener('keydown', e => {
      const k = STG.findIndex(x => x.kind === S.kind);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); const n = STG[(k + 1) % STG.length].kind; open(n); tiles[n].focus(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); const n = STG[(k + STG.length - 1) % STG.length].kind; open(n); tiles[n].focus(); }
    });
    tiles[S.kind] = tile; grid.append(tile);

    const body = h('div', { class:'stage-body' });
    const prevS = STG[i - 1], nextS = STG[i + 1];
    /* 활동 간 이동(박스 밖 아래). 첫 활동의 ◀는 이전 주제로, 마지막 활동의 ▶는 다음 주제로 이어져요 */
    const prevL = LESSONS[L.id - 1], nextL = LESSONS[L.id + 1];
    const topicNext = () => nextL
      ? h('button', { class:'btn primary topic-next', style:{ '--k': nextL.hex }, onclick: () => tryOpen(nextL.id) }, isUnlocked(nextL.id) ? `다음 주제: ${nextL.short} ▶` : `🔒 다음 주제: ${nextL.short}`)
      : (allDone() ? h('button', { class:'btn primary topic-next', onclick: () => go('done') }, '🏆 자료 분석 완료 ▶') : h('span', { class:'topic-next' }));
    const row = h('div', { class:'stage-foot' },
      prevS ? h('button', { class:`btn k-${prevS.kind}`, onclick: () => open(prevS.kind, true) }, `◀ ${prevS.label}`) : h('span'),
      nextS ? h('button', { class:`btn primary k-${nextS.kind}`, onclick: () => open(nextS.kind, true) }, `${nextS.label} ▶`) : h('span'));
    const foot = h('div', { class:'stage-foot-wrap', id:`foot-${L.id}-${S.kind}`, hidden:true }, row);
    if (!nextS) foot.append(h('nav', { class:'topic-foot', 'aria-label':'주제 간 이동' },
      prevL ? h('button', { class:'btn', style:{ '--k': prevL.hex }, onclick: () => go(`lesson-${prevL.id}`) }, `◀ 이전 주제: ${prevL.short}`) : h('span'),
      topicNext()));
    const panel = h('section', { class:`stage-panel k-${S.kind}`, role:'tabpanel', id:`panel-${L.id}-${S.kind}`, 'aria-labelledby':`tab-${L.id}-${S.kind}`, hidden:true },
      h('div', { class:'stage-panel-head' },
        h('span', { class:'stage-panel-ico', 'aria-hidden':'true' }, S.icon),
        h('div', {}, h('div', { class:'stage-panel-step' }, `${i + 1}단계`), h('h3', {}, S.label))),
      body);
    panels[S.kind] = panel; bodies[S.kind] = body; feet[S.kind] = foot; stage.append(panel, foot);
  });

  function open(kind, scroll, first){
    try { Calc.close(); } catch(e){}
    if (!tiles[kind]) kind = 'goal';
    if (typeof clsStageBlocked === 'function' && clsStageBlocked(L.id, kind)){
      if (scroll){ toast('🔒 선생님이 잠가 둔 활동이에요. 열릴 때까지 기다려 주세요.'); return; }
      const ok = STG.find(S => !clsStageBlocked(L.id, S.kind)); kind = ok ? ok.kind : 'goal';
    }
    if (first) setTimeout(() => { const c1 = $('.subact-card', panels[kind]); if (c1) c1.click(); });
    current = kind;
    STG.forEach(S => {
      const on = S.kind === kind;
      tiles[S.kind].setAttribute('aria-selected', on);
      tiles[S.kind].tabIndex = on ? 0 : -1;
      panels[S.kind].hidden = !on; feet[S.kind].hidden = !on;
    });
    seen[kind] = true;
    try { window.getSelection().removeAllRanges(); } catch(e){}
    tiles[kind].classList.add('seen');
    if (grid.scrollWidth > grid.clientWidth + 2){ const t = tiles[kind]; const l = t.offsetLeft - grid.offsetLeft; if (l < grid.scrollLeft || l + t.offsetWidth > grid.scrollLeft + grid.clientWidth) grid.scrollLeft = Math.max(0, l - 12); } /* 좁은 화면: 고른 카드가 보이게 */
    panels[kind].classList.remove('pop'); void panels[kind].offsetWidth; panels[kind].classList.add('pop');
    store.set(s2 => { s2.lessonData[L.id] = Object.assign(s2.lessonData[L.id] || {}, { open: kind, seen }); });
    if (scroll){ const top = grid.getBoundingClientRect().top + window.scrollY - (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 72) - 12; if (window.scrollY > top) window.scrollTo({ top, behavior:'smooth' }); }
  }
  Object.keys(seen).forEach(k => tiles[k] && tiles[k].classList.add('seen'));

  const api = {
    lesson: L, open,
    panel: kind => bodies[kind],
    fill: (kind, ...nodes) => { if (!bodies[kind]) return; bodies[kind].innerHTML = ''; bodies[kind].append(...groupSubActs(nodes.flat().filter(Boolean), L, kind)); },
    complete: () => completeLesson(L.id),
    createChart, createDataInput, createQuiz, createSlider, createStepper, createDnD, openLab, stats, guideAvatar,
    saveFinding: (k, t) => saveFinding(L.id, k, t)
  };
  // 기본 내용(다음 단계에서 덮어씀)
  api.fill('goal', h('div', { class:'goal-box' }, h('span', { class:'goal-flag', 'aria-hidden':'true' }, '🎯'), h('p', {}, L.goal)));
  api.fill('open', h('div', { class:'guide' }, guideAvatar('A'), h('div', { class:'bubble' }, '어떤 질문으로 시작할지 다음 단계에서 정해 줄게!')));
  api.fill('concept', placeholder('교과서처럼 테두리 상자로 개념을 정리할 자리예요.'));
  api.fill('explore', placeholder('예측하기 → 직접 조작하기 → 발견한 점 쓰기 활동이 들어올 자리예요.'));
  api.fill('quiz', placeholder('퀴즈를 풀면 이 학습이 완료되고 다음 학습이 열려요.'));
  if (LESSON_BUILDERS[L.id]) LESSON_BUILDERS[L.id](api);
  open(current);

}

function equalizeBtnRows(){
  $$('#view .btn-row:has(> :not(.btn)), #view .btn-row.subact-nav').forEach(row => {
    const bs = [...row.children].filter(c => c.classList && c.classList.contains('btn'));
    if (bs.length < 2) return;
    bs.forEach(b => b.style.minWidth = '');
    const ws = bs.map(b => b.getBoundingClientRect().width);
    if (!ws.every(Boolean)) return;
    const m = Math.ceil(Math.max(...ws)), cap = row.clientWidth;
    if (m * bs.length + 8 * (bs.length - 1) > cap) return; /* 좁은 화면에서 넘치면 그대로 */
    bs.forEach(b => b.style.minWidth = m + 'px');
  });
}

const CLS_NO = '①②③④⑤⑥⑦⑧⑨⑩';
const cls = { role:null, mode:null, user:null, cfg:{ locks:{}, buttons:{ answer:true, hint:true, calc:true }, pause:false, pwHash:null, updatedAt:0 } };

/* --- 저장 도우미 --- */
const clsMem = {};
const clsSess = {
  get(k){ try { return sessionStorage.getItem(k); } catch(e){ return clsMem[k] ?? null; } },
  set(k, v){ clsMem[k] = v; try { sessionStorage.setItem(k, v); } catch(e){} },
  remove(k){ delete clsMem[k]; try { sessionStorage.removeItem(k); } catch(e){} }
};
const clsLoc = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  raw(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  setRaw(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
function clsHash(s){ let x = 0x811c9dc5; for (const ch of 'naneun#' + String(s)){ x ^= ch.codePointAt(0); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(16).padStart(8, '0'); }
const clsUrl = () => (clsLoc.raw(CLS_KEY.url) || SHEET_WEBAPP_URL || '').trim();
const clsPwHash = () => cls.cfg.pwHash || clsHash(TEACHER_PASSWORD);
const isStudent = () => cls.role === 'student';
const isAdmin = () => cls.role === 'admin';
const clsEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const clsQ = (url, q) => url + (url.includes('?') ? '&' : '?') + q + '&t=' + Date.now();
const clsR2 = x => Math.round(x * 100) / 100;

/* =====================================================================
   1. 활동 구성: 주제 › 활동 › 소활동 (칸 = '단위')
   열쇠: 활동만 있으면 "3:open", 소활동이면 "3:concept:1"
   ===================================================================== */
const CLS_UNITS = (() => { const out = [];
  CLS_CATALOG.forEach(L => L.st.forEach((S, si) => {
    const base = { li:L.id, lesson:L.t, si, kind:S.k, step:`${si + 1}. ${S.l}` };
    if (S.s) S.s.forEach(([t, a, d, g], k) => out.push({ ...base, key:`${L.id}:${S.k}:${k}`, sub:`${k + 1}) ${t}`, label:t, short:CLS_NO[k], k, a, d, g }));
    else out.push({ ...base, key:`${L.id}:${S.k}`, sub:'', label:S.l, short:'', a:S.m[0], d:S.m[1], g:S.m[2], quiz:S.k === 'quiz' });
  })); return out; })();
const clsUnit = key => CLS_UNITS.find(u => u.key === key);

/* =====================================================================
   2. 활동 점수 기준 (입체도형 탐험대 배점 기준표와 같은 방식)
   · 탐색 1점: 활동(소활동)을 열어서 살펴보기
   · 조작 1점: 버튼·입력·그래프 끌기 등 직접 조작하기 (조작할 것이 있는 활동만)
   · 활동 완료 1점: 캐릭터 질문을 끝까지 해결하거나 문제를 풀어 정답 확인 받기 (풀 문제가 있는 활동만)
   · 퀴즈 3점: 주제마다 확인 퀴즈(놀이·프로젝트는 마무리 활동)를 끝까지 마치기
   ===================================================================== */
const CLS_QUIZ_TEXT = { 5:'사건을 모두 해결하고 명탐정 배지 받기', 7:'프로젝트를 끝까지 마치기' };
const CLS_LEAVES = (() => { const out = [];
  CLS_UNITS.forEach(u => {
    const path = u.short ? `${u.li}-${u.si + 1}-${u.k + 1}` : `${u.li}-${u.si + 1}`;
    const add = (kind, crit, max, test) => out.push({ u, lesson:u.lesson, step:u.step, sub:u.sub, path, det: u.sub ? u.label : u.step.replace(/^\d+\.\s*/, ''), kind, crit, max, test });
    if (u.quiz){ add('퀴즈', CLS_QUIZ_TEXT[u.li] || '확인 퀴즈를 모두 풀고 결과 보기', 3, f => f.quiz(u.li) ? 3 : 0); return; }
    add('탐색', `'${u.label}' 열어서 살펴보기`, 1, f => f.v(u) ? 1 : 0);
    if (u.a) add('조작', `'${u.label}'에서 버튼·입력·그래프를 직접 조작하기`, 1, f => f.i(u) ? 1 : 0);
    if (u.d) add('활동 완료', u.g ? `'${u.label}'의 캐릭터 질문을 끝까지 해결하기` : `'${u.label}'의 문제를 풀어 정답 확인 받기`, 1, f => f.d(u) ? 1 : 0);
  });
  return out; })();
/** 진행 기록(progress) → 사실 판단 */
function clsFacts(pg){
  pg = pg || {}; const act = pg.act || {}, comp = pg.completed || {}, sc = pg.scores || {};
  const a = u => act[u.key] || {};
  return { v: u => !!(a(u).v || a(u).i || a(u).d), i: u => !!a(u).i, d: u => !!a(u).d, quiz: li => !!(comp[li] || sc[li]) };
}
/** 점수 표: 열 이름·만점·점수 (주제 → 활동 → 소활동 → 세부활동 순) + 기준표 */
function clsScoreCalc(pg){
  const f = clsFacts(pg), got = CLS_LEAVES.map(x => x.test(f));
  const cols = [], maxes = [], vals = [], crit = [];
  const sum = pred => { let a = 0, b = 0, lo = -1, hi = -1; CLS_LEAVES.forEach((x, i) => { if (pred(x)){ a += got[i]; b += x.max; if (lo < 0) lo = i; hi = i + 1; } }); return [clsR2(a), clsR2(b), [Math.max(lo, 0), Math.max(hi, 0)]]; };
  const push = (name, [a, b, range], c) => { cols.push(name); maxes.push(b); vals.push(a); crit.push({ ...c, range }); };
  const T = sum(() => true);
  CLS_CATALOG.forEach(L => push(`[주제] ${L.t}`, sum(x => x.u.li === L.id), { level:'주제', lesson:L.t }));
  CLS_CATALOG.forEach(L => L.st.forEach((S, si) => push(`[활동] ${L.id}-${si + 1}. ${S.l}`, sum(x => x.u.li === L.id && x.u.si === si), { level:'활동', lesson:L.t, step:`${si + 1}. ${S.l}` })));
  CLS_UNITS.filter(u => u.short).forEach(u => push(`[소활동] ${u.li}-${u.si + 1}-${u.k + 1}) ${u.label}`, sum(x => x.u === u), { level:'소활동', lesson:u.lesson, step:u.step, sub:u.sub }));
  CLS_LEAVES.forEach((x, i) => { cols.push(`[세부] ${x.path} ${x.det} · ${x.kind}`); maxes.push(x.max); vals.push(got[i]);
    crit.push({ level:'세부활동', lesson:x.lesson, step:x.step, sub:x.sub, det:x.det, kind:x.kind, crit:x.crit }); });
  return { total:T[0], max:T[1], cols, maxes, got:vals, crit, leafGot:got };
}
/** 활동 구성표 (구글 시트 '활동 구성' 탭) */
function clsComposition(){
  const head = ['번호', '주제', '활동', '소활동', '세부활동', '활동 종류', '완료 기준', '배점'];
  const rows = CLS_LEAVES.map((x, i) => [i + 1, x.lesson, x.step, x.sub, x.det, x.kind, x.crit, x.max]);
  const kinds = ['탐색', '조작', '활동 완료', '퀴즈'];
  const summary = [['주제', ...kinds, '합계']];
  CLS_CATALOG.forEach(L => { const r = kinds.map(k => clsR2(CLS_LEAVES.filter(x => x.u.li === L.id && x.kind === k).reduce((a, x) => a + x.max, 0)));
    summary.push([L.t, ...r, clsR2(r.reduce((a, b) => a + b, 0))]); });
  const tot = kinds.map((_, i) => clsR2(summary.slice(1).reduce((a, r) => a + r[i + 1], 0)));
  summary.push(['합계', ...tot, clsR2(tot.reduce((a, b) => a + b, 0))]);
  return { action:'composition', auth:clsPwHash(), head, rows, summary, widths:[50, 200, 130, 220, 200, 90, 360, 60] };
}

/* =====================================================================
   3. 활동 기록: 지금 보이는 칸(열람), 조작, 완료를 기록 (store.state.act)
   ===================================================================== */
function clsLessonId(){ const m = currentRoute().match(/^lesson-(\d)$/); return m ? Number(m[1]) : null; }
/** 요소가 속한 칸 */
function clsUnitOfEl(el){
  const panel = el && el.closest && el.closest('.stage-panel'); if (!panel) return null;
  const m = panel.id.match(/^panel-(\d+)-(\w+)$/); if (!m) return null;
  const sec = el.closest('.subact-sec');
  if (sec && panel.contains(sec)){ const area = sec.parentElement; const k = [...area.children].filter(x => x.classList.contains('subact-sec')).indexOf(sec); return { key:`${m[1]}:${m[2]}:${k}`, root:sec }; }
  if (panel.querySelector('.subacts')) return null;
  return { key:`${m[1]}:${m[2]}`, root:panel.querySelector('.stage-body') || panel };
}
/** 지금 보이는 칸 */
function clsCurUnit(){
  if (clsLessonId() == null) return null;
  const panel = $$('#view .stage-panel').find(p => !p.hidden); if (!panel) return null;
  const sec = $$('.subact-area > .subact-sec', panel).find(x => !x.hidden);
  return clsUnitOfEl(sec || panel.querySelector('.stage-body'));
}
function clsAct(key, f, v = 1){
  if (!isStudent() || !key || !clsUnit(key)) return false;
  const cur = (store.state.act || {})[key] || {};
  if (cur[f] === v) return false;
  store.set(st => { st.act = st.act || {}; st.act[key] = Object.assign({}, st.act[key] || {}, { [f]: v }); });
  clsScoreUISoon(); clsScoreSoon(); clsStatusSoon();
  return true;
}
/** 칸 완료 판단: 캐릭터 질문이 끝까지 열리고 마지막 단계가 해결되었거나, 정답 표시가 하나라도 나오면 */
function clsRootDone(root){
  const gf = root.querySelector('.g-flow, .plain-steps');
  if (gf){
    const steps = [...gf.children]; const last = steps[steps.length - 1];
    if (!last || last.hidden) return false;
    const interactive = last.querySelector('button:not(.calc-toggle), input, select, textarea');
    return !interactive || !!last.querySelector('.quiz-feedback.ok, .sit-fb .ok, [data-ok]');
  }
  return !!root.querySelector('.quiz-feedback.ok, .sit-fb .ok, [data-ok], .quiz-result');
}
let clsCurKey = '', clsEnterAt = 0;
function clsTick(){
  if (!isStudent() || document.hidden) return;
  const u = clsCurUnit(), key = u ? u.key : (currentRoute() || '');
  if (key !== clsCurKey){ clsLeave(); clsCurKey = key; clsEnterAt = Date.now(); clsStatusSoon(); }
  if (!u) return;
  clsAct(u.key, 'v');
  const meta = clsUnit(u.key);
  if (meta && meta.d && clsRootDone(u.root)) clsAct(u.key, 'd');
}
/** 칸을 떠날 때: 머문 시간을 더하고 학습 기록을 시트로 보냄 */
function clsLeave(){
  const key = clsCurKey, meta = clsUnit(key); if (!isStudent() || !meta || !clsEnterAt) return;
  const sec = Math.round((Date.now() - clsEnterAt) / 1000); clsEnterAt = 0;
  const prev = (store.state.act || {})[key] || {};
  store.set(st => { st.act = st.act || {}; st.act[key] = Object.assign({}, prev, { t:(prev.t || 0) + sec, n:(prev.n || 0) + 1 }); });
  clsRecord(key);
}
function clsUnitPct(pgFacts, u){ const ls = CLS_LEAVES.filter(x => x.u === u); const mx = ls.reduce((a, x) => a + x.max, 0); return mx ? Math.round(ls.reduce((a, x) => a + x.test(pgFacts), 0) / mx * 100) : 0; }
function clsSnapshot(){
  const pg = clsProgress(), f = clsFacts(pg), o = {};
  Object.keys(pg.act || {}).forEach(k => { const u = clsUnit(k); if (!u) return; const a = pg.act[k];
    o[k] = { lesson:u.lesson, step:u.step, sub:u.sub, key:k, best:clsUnitPct(f, u), time:a.t || 0, visits:a.n || 0 }; });
  CLS_UNITS.filter(u => u.quiz && f.quiz(u.li)).forEach(u => { const s = (pg.scores || {})[u.li] || {};
    o[u.key] = { lesson:u.lesson, step:u.step, sub:'', key:u.key, best:100, correct:s.first ?? '', total:s.total ?? '' }; });
  return o;
}
function clsRecord(key){
  if (!isStudent() || !cls.user) return;
  const snap = clsSnapshot(), it = snap[key] || { ...clsUnit(key), key };
  clsSend({ action:'record', sid:cls.user.sid, name:cls.user.name, sentAt:new Date().toISOString(),
    item:{ lesson:it.lesson, step:it.step, sub:it.sub, score:it.best, best:it.best, time:it.time, visits:it.visits, correct:it.correct, total:it.total },
    completedLessons:LESSONS.filter(L => store.state.completed[L.id]).length, snapshot:snap, quiz:quizSum(), progress:clsProgress() });
  clsScoreNow();
}
function quizSum(){ const o = {}; Object.entries(store.state.scores || {}).forEach(([k, v]) => { o[LESSONS[k] ? LESSONS[k].short : k] = { best:v.first, total:v.total }; }); return o; }
/** 조작 기록: 활동 안의 버튼·입력·끌기 (이동 버튼은 빼고) */
const CLS_NAV = '.subact-nav, .subact-grid, .stage-foot-wrap, .stage-grid, .topic-foot, .calc-panel';
function clsTrack(e){
  if (!isStudent()) return;
  const t = e.target; if (!t || !t.closest || t.closest(CLS_NAV)) return;
  if (e.type === 'click' && !t.closest('button, [role=button], label, .chip, input, select, .fruit-card, svg')) return;
  if (e.type === 'pointerup' && !t.closest('svg, canvas, .fruit-card, .chart, .scatter')) return;
  const u = clsUnitOfEl(t); if (u) clsAct(u.key, 'i');
}
['click', 'input', 'change', 'pointerup'].forEach(tp => document.addEventListener(tp, clsTrack, true));
setInterval(clsTick, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden){ clsLeave(); clsCurKey = ''; clsScoreNow(); } else clsStatusSoon(); });
window.addEventListener('hashchange', () => setTimeout(clsWho, 0));

/* =====================================================================
   4. 진행 상태 저장·불러오기 (이어서 하기)
   ===================================================================== */
function clsProgress(){ const st = store.state; return { completed:st.completed || {}, scores:st.scores || {}, findings:st.findings || {}, lessonData:st.lessonData || {}, lab:st.lab || null, act:st.act || {} }; }
function clsApplyProgress(pg){
  if (!pg || typeof pg !== 'object') return false;
  store.set(st => { ['completed', 'scores', 'findings', 'lessonData', 'act'].forEach(k => { st[k] = pg[k] || {}; }); st.lab = pg.lab || null; });
  return true;
}
function clsHasRecords(){ const st = store.state; return Object.keys(st.completed || {}).length || Object.keys(st.act || {}).length || Object.keys(st.lessonData || {}).length; }
function clsClearRecords(){
  const keep = { sideCollapsed: store.state.sideCollapsed };
  store.reset(); store.set(st => Object.assign(st, keep));
  clsLoc.set(CLS_KEY.sheetSc, {});
}
async function clsRestore(sid, name){
  const url = clsUrl(); if (!url) return null;
  try { const r = await (await fetch(clsQ(url, `action=restore&sid=${encodeURIComponent(sid)}&name=${encodeURIComponent(name)}`))).json(); return r && r.ok && r.progress ? r.progress : null; }
  catch(e){ return null; }
}

/* --- 전송 (보내지 못하면 모아 두었다가 다시 보냄) --- */
let clsSending = false;
function clsSend(payload){ if (!clsUrl()) return; const q = clsLoc.get(CLS_KEY.queue, []); q.push(payload); clsLoc.set(CLS_KEY.queue, q.slice(-200)); clsFlush(); }
async function clsFlush(){
  const url = clsUrl(); if (!url || clsSending) return;
  clsSending = true;
  try {
    let q = clsLoc.get(CLS_KEY.queue, []);
    while (q.length){
      await fetch(url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(q[0]) });
      q = clsLoc.get(CLS_KEY.queue, []); q.shift(); clsLoc.set(CLS_KEY.queue, q);
    }
  } catch(e){ /* 인터넷이 끊김: 다음에 다시 */ }
  clsSending = false;
}
setInterval(clsFlush, 30000);
window.addEventListener('online', clsFlush);

/* --- 활동 점수 보내기 (바뀌었을 때만, 45초에 한 번까지 / 칸을 옮길 때는 바로) --- */
let clsScT = 0, clsScSig = '', clsScAt = 0, clsMyT = 0;
function clsScoreSoon(){ if (!isStudent()) return; clearTimeout(clsScT); clsScT = setTimeout(clsScoreSend, Math.max(2000, 45000 - (Date.now() - clsScAt))); }
function clsScoreNow(){ if (!isStudent()) return; clearTimeout(clsScT); clsScoreSend(); }
function clsScoreSend(){
  if (!isStudent() || !cls.user || !clsUrl()) return;
  const r = clsScoreCalc(clsProgress()), sig = r.leafGot.join('');
  if (sig === clsScSig) return; clsScSig = sig; clsScAt = Date.now();
  clsSend({ action:'scores', items:[{ sid:cls.user.sid, name:cls.user.name, total:r.total, got:r.got }], cols:r.cols, max:r.maxes, maxTotal:r.max, crit:r.crit, sentAt:new Date().toISOString() });
  clearTimeout(clsMyT); clsMyT = setTimeout(clsMyScoresFetch, 8000);
}
/** 시트에 기록된 내 점수(다른 기기에서 한 활동 포함) */
function clsSheetSc(){ const o = clsLoc.get(CLS_KEY.sheetSc, {}); return (cls.user && o.who === cls.user.sid + '|' + cls.user.name && o.scores) || {}; }
async function clsMyScoresFetch(){
  const url = clsUrl(); if (!isStudent() || !cls.user || !url) return;
  try { const r = await (await fetch(clsQ(url, `action=myScores&sid=${encodeURIComponent(cls.user.sid)}&name=${encodeURIComponent(cls.user.name)}`))).json();
    if (r && r.ok){ clsLoc.set(CLS_KEY.sheetSc, { who:cls.user.sid + '|' + cls.user.name, scores:r.scores || {}, at:Date.now() }); clsScoreUISoon(); } } catch(e){}
}
/** 주제별 점수 (이 기기 기록과 시트 기록 중 큰 값) */
function clsTopicScore(li){
  const f = clsFacts(clsProgress()), sh = clsSheetSc(); let a = 0, b = 0;
  CLS_LEAVES.forEach(x => { if (x.u.li !== li) return; const nm = `[세부] ${x.path} ${x.det} · ${x.kind}`;
    a += Math.min(x.max, Math.max(x.test(f), Number(sh[nm]) || 0)); b += x.max; });
  return [clsR2(a), clsR2(b)];
}
let clsScUIT = 0;
function clsScoreUISoon(){ clearTimeout(clsScUIT); clsScUIT = setTimeout(clsScoreUI, 300); }
function clsScoreUI(){
  $$('.who-sc[data-l]').forEach(w => {
    const li = w.dataset.l === '' ? null : Number(w.dataset.l);
    if (!isStudent() || li == null){ w.hidden = true; return; }
    const [a, b] = clsTopicScore(li); if (!b){ w.hidden = true; return; }
    const pct = Math.round(a / b * 100), t = `${a}/${b}`;
    w.hidden = false; if (w.dataset.t === t) return; w.dataset.t = t;
    w.innerHTML = `<span class="ws-lab">활동 점수</span><span class="ws-bar" role="img" aria-label="활동 점수 ${a}점, 만점 ${b}점"><i style="width:${pct}%"></i></span><b class="ws-val">${a}</b><span class="ws-max">/ ${b}점</span>`;
  });
}

/* =====================================================================
   5. 모니터링 신호: 지금 하는 칸과 마친 칸
   ===================================================================== */
function clsDoneKeys(){ const f = clsFacts(clsProgress()); return CLS_UNITS.filter(u => { const ls = CLS_LEAVES.filter(x => x.u === u); return ls.length && ls.every(x => x.test(f) >= x.max); }).map(u => u.key); }
let clsStSent = '', clsStAt = 0, clsStT = 0;
function clsStatusSoon(){ if (!isStudent()) return; clearTimeout(clsStT); clsStT = setTimeout(() => clsStatus(false), 600); }
function clsStatus(beat){
  const url = clsUrl(); if (!isStudent() || !url || !cls.user) return;
  const u = clsCurUnit(), cur = u ? u.key : (currentRoute() === 'done' ? '__finish' : currentRoute() === 'lab' ? '__lab' : ''), done = clsDoneKeys(), sig = cur + '|' + done.join(',');
  if (sig === clsStSent && (!beat || Date.now() - clsStAt < 25000)) return;
  clsStSent = sig; clsStAt = Date.now();
  fetch(url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ action:'status', sid:cls.user.sid, name:cls.user.name, cur, done }) }).catch(() => { clsStSent = ''; });
}
setInterval(() => { if (isStudent() && !document.hidden) clsStatus(true); }, 30000);

/* =====================================================================
   6. 수업 설정 받기·적용 (잠금 · 화면 멈춤 · 버튼 허용)
   ===================================================================== */
function clsNormCfg(c){ c = c || {}; return { locks:c.locks || {}, buttons:Object.assign({ answer:true, hint:true, calc:true }, c.buttons || {}), pause:!!c.pause, pwHash:c.pwHash || null, updatedAt:c.updatedAt || 0 }; }
function clsLock(key){ if (!isStudent()) return 'open-admin'; return (cls.cfg.locks || {})[key] || 'auto'; }
/** 주제 잠금: 학생에게만 적용 (자동이면 앞 주제의 확인 퀴즈를 마쳐야 열림) */
function clsTopicOpen(id, fallback){ const k = clsLock(`lesson-${id}`); if (k === 'open') return true; if (k === 'lock') return false; return fallback; }
function clsStageBlocked(lid, kind){ return isStudent() && clsLock(`${lid}:${kind}`) === 'lock'; }
function clsSubBlocked(lid, kind, i){ return isStudent() && (clsLock(`${lid}:${kind}:${i}`) === 'lock' || clsLock(`${lid}:${kind}`) === 'lock'); }
let clsCfgReady = false;
async function clsFetchCfg(){
  const url = clsUrl(); if (!url) return;
  try {
    const j = await (await fetch(clsQ(url, 'action=config'))).json();
    if (j && j.config){
      const nc = clsNormCfg(j.config);
      if (JSON.stringify(nc) !== JSON.stringify(cls.cfg)){
        const lockChanged = JSON.stringify(nc.locks) !== JSON.stringify(cls.cfg.locks);
        cls.cfg = nc; clsLoc.set(CLS_KEY.cfg, nc); clsApply();
        if (isStudent() && lockChanged && clsCfgReady){ clsLeave(); clsCurKey = ''; render(); }
      }
    }
    clsCfgReady = true;
  } catch(e){}
}
function clsApply(){
  const stu = isStudent(), b = cls.cfg.buttons;
  document.body.classList.toggle('cls-student', stu);
  document.body.classList.toggle('cls-role-admin', isAdmin());
  document.body.classList.toggle('cls-no-calc', stu && !b.calc);
  const ov = $('#clsPause'); if (ov) ov.hidden = !(stu && cls.cfg.pause);

}
/** 잠긴 활동·소활동 카드 표시 */
function clsMarkLocks(){
  $$('#view .stage-tile').forEach(t => { const m = t.id.match(/^tab-(\d+)-(\w+)$/); if (m) t.classList.toggle('cls-locked', clsStageBlocked(+m[1], m[2])); });

/* 정답 보기·힌트·계산기 버튼 잠금 */
document.addEventListener('click', e => {

async function clsLoadScoreTable(box){

  if (!url){ box.innerHTML = '<p class="muted">구글 시트 주소가 없어요. 위의 구글 시트 연결에서 주소를 넣어 주세요.</p>'; return; }
  box.innerHTML = '<p class="muted">불러오는 중…</p>';
  try {
    const r = await (await fetch(clsQ(url, `action=allScores&auth=${encodeURIComponent(clsPwHash())}`))).json();
    if (!r || !r.ok){ box.innerHTML = `<p class="muted">⚠️ ${clsEsc((r && r.error) || '불러오지 못했어요. 앱스 스크립트를 새 버전으로 배포했는지 확인해 주세요.')}</p>`; return; }

    const lc = H.map((x, i) => [x, i]).filter(([x]) => x.startsWith('[주제]'));
    const num = v => (v === '' || v == null) ? '—' : clsR2(Number(v));
    const head = `<tr><th>학번</th><th>이름</th><th>총점</th>${lc.map(([x, i]) => `<th title="${clsEsc(x)}">${clsEsc(x.replace('[주제] ', ''))}<small>${num(r.max[i])}점</small></th>`).join('')}<th>갱신</th></tr>`;
    const rows = r.students.map(o => { const t = Number(o[iT]) || 0, mx = Number(o[iM]) || Number(r.max[iT]) || 0, p = mx ? Math.round(t / mx * 100) : 0;

    box.innerHTML = `<div class="cls-sc-wrap"><table class="cls-sc"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  } catch(e){ box.innerHTML = '<p class="muted">⚠️ 불러오지 못했어요. 인터넷과 구글 시트 주소, 앱스 스크립트 배포(새 버전)를 확인해 주세요.</p>'; }
}

const CLS_MON = { view:null, live:false, timer:0 };
function clsAgo(ms){ const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}초 전` : s < 3600 ? `${Math.floor(s / 60)}분 전` : `${Math.floor(s / 3600)}시간 전`; }
function clsCurText(key){
  if (!key) return '처음 화면';
  if (key === '__finish') return '자료 분석 완료'; if (key === '__lab') return '자료 실험실';
  const u = clsUnit(key); if (!u) return key;
  return `${u.lesson} › ${u.step}${u.short ? ` › ${u.short} ${u.label}` : ''}`;
}
async function clsOpenMonitor(){

    <div class="cls-row cls-foot"><button class="btn" type="button" data-a="run">▶ 수업 진행으로</button><button class="btn" type="button" data-a="manage">⚙️ 수업 관리</button><button class="btn" type="button" data-a="comp">📋 활동 구성표 만들기</button><button class="btn" type="button" data-a="score">🧮 활동 점수 다시 계산</button><button class="btn" type="button" data-a="clear">🧹 목록 비우기</button></div>`, 'cls-admin cls-monitor');

clsStart();
if (!store.persistent) setTimeout(() => toast('이 화면에서는 진도가 저장되지 않아요. 창을 닫으면 처음부터 시작해요.', 3600), 800);

/* ===== 🧮 계산기: 계산이 필요한 입력(data-calc) 옆에 여닫는 버튼 ===== */
const Calc = (() => {
  let panel = null, disp = null, exprEl = null, expr = '', target = null, justEval = false;
  const toggles = new Set();
  const fmtN = v => { if (!isFinite(v)) return '오류'; const r = Math.round(v * 1e10) / 1e10; return String(r); };
  const evaluate = str => {
    const src = str.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    if (!/^[\d.+\-*/() ]*$/.test(src) || !src.trim()) return NaN;
    let i = 0;
    const peek = () => src[i], skip = () => { while (src[i] === ' ') i++; };
    const num = () => { skip(); if (src[i] === '('){ i++; const v = add(); skip(); if (src[i] === ')') i++; return v; }
      if (src[i] === '-'){ i++; return -num(); } const m = /^\d*\.?\d+|^\d+\.?/.exec(src.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); };
    const mul = () => { let v = num(); for (;;){ skip(); const c = peek(); if (c === '*'){ i++; v *= num(); } else if (c === '/'){ i++; v /= num(); } else return v; } };
    const add = () => { let v = mul(); for (;;){ skip(); const c = peek(); if (c === '+'){ i++; v += mul(); } else if (c === '-'){ i++; v -= mul(); } else return v; } };
    try { const v = add(); skip(); return i === src.length ? v : NaN; } catch (e){ return NaN; }
  };
  const show = () => { exprEl.textContent = expr || ' '; const v = evaluate(expr); disp.textContent = expr ? (isNaN(v) ? '…' : fmtN(v)) : '0'; };
  const press = k => {
    if (k === 'C'){ expr = ''; }
    else if (k === '⌫'){ expr = expr.slice(0, -1); }
    else if (k === '='){ const v = evaluate(expr); if (!isNaN(v)){ expr = fmtN(v); justEval = true; show(); return; } }
    else { if (justEval && /[\d.]/.test(k)) expr = ''; expr += k; }
    justEval = false; show();
  };
  const build = () => {
    exprEl = h('div', { class:'calc-expr', 'aria-live':'polite' }, ' ');
    disp = h('div', { class:'calc-disp' }, '0');
    const keys = ['C', '(', ')', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '⌫', '='];
    const pad = h('div', { class:'calc-pad' }, keys.map(k => h('button', { class:'calc-key' + (/[÷×−+=]/.test(k) ? ' op' : '') + (k === 'C' || k === '⌫' ? ' fn' : ''), type:'button', 'aria-label': k === '⌫' ? '한 글자 지우기' : k === 'C' ? '모두 지우기' : k, onclick: () => press(k) }, k)));
    const put = h('button', { class:'btn primary small calc-put', type:'button', onclick: () => {
      const v = evaluate(expr); if (isNaN(v)){ toast('먼저 계산해 보자!'); return; }
      if (!target || !document.body.contains(target)){ toast('답을 넣을 칸을 먼저 눌러 보자.'); return; }
      target.value = fmtN(v); target.dispatchEvent(new Event('input', { bubbles:true })); target.focus(); toast('답 칸에 넣었어요. 확인 버튼을 눌러 보자!'); } }, '답 칸에 넣기');
    panel = h('div', { class:'calc-panel', role:'dialog', 'aria-label':'계산기', hidden:true },
      h('div', { class:'calc-head', title:'끌어서 옮길 수 있어요', onpointerdown: e => drag(e) }, h('b', {}, '🧮 계산기'), h('button', { class:'calc-x', type:'button', 'aria-label':'계산기 닫기', onclick: () => close() }, '✕')),
      exprEl, disp, pad, put);
    panel.addEventListener('keydown', e => {
      const map = { '*':'×', '/':'÷', '-':'−', 'Enter':'=', 'Backspace':'⌫', 'Escape':null, 'Delete':'C' };
      if (e.key === 'Escape'){ close(); return; }
      let k = e.key in map ? map[e.key] : e.key;
      if (/^[\d.+()]$/.test(k) || ['×', '÷', '−', '=', '⌫', 'C'].includes(k)){ e.preventDefault(); press(k); }
    });
    document.body.append(panel);
  };
  const sync = () => toggles.forEach(b => { if (!document.body.contains(b)){ toggles.delete(b); return; } const on = panel && !panel.hidden; b.setAttribute('aria-expanded', String(on)); b.textContent = on ? '🧮 계산기 닫기' : '🧮 계산기'; b.classList.toggle('on', on); });
  const open = (inp, btn) => { if (!panel) build(); if (inp) target = inp; panel.hidden = false;
    const k = btn && getComputedStyle(btn).getPropertyValue('--k').trim(); panel.style.setProperty('--k', k || 'var(--primary)');
    place(btn); sync(); setTimeout(() => panel.querySelector('.calc-key').focus({ preventScroll:true }), 30); };
  /* 입력 칸을 가리지 않도록: 버튼·입력 줄의 왼쪽(공간이 없으면 위/아래)에 띄워요 */
  const place = btn => {
    panel.style.left = panel.style.top = panel.style.right = panel.style.bottom = '';
    if (!btn || window.innerWidth < 768) return;
    const row = (btn.closest('.quiz-input-row, .calc-row, .btn-row') || btn).getBoundingClientRect();
    const pw = panel.offsetWidth, ph = panel.offsetHeight, vw = window.innerWidth, vh = window.innerHeight, M = 12;
    let left, top;
    const rowLeft = Math.min(row.left, (target && document.body.contains(target)) ? target.getBoundingClientRect().left : row.left);
    if (rowLeft - pw - M > 8){ left = rowLeft - pw - M; top = row.top + row.height / 2 - ph / 2; }
    else { left = row.right - pw; top = row.top - ph - M; if (top < 80) top = row.bottom + M; }
    left = Math.max(8, Math.min(vw - pw - 8, left)); top = Math.max(80, Math.min(vh - ph - 8, top));
    panel.style.left = left + 'px'; panel.style.top = top + 'px'; panel.style.right = 'auto'; panel.style.bottom = 'auto';
  };
  /* 머리 부분을 끌어 옮길 수 있어요 */
  const drag = e => {
    if (e.target.closest('button') || window.innerWidth < 768) return;
    const r = panel.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    const mv = ev => { panel.style.left = Math.max(0, Math.min(window.innerWidth - r.width, ev.clientX - dx)) + 'px'; panel.style.top = Math.max(0, Math.min(window.innerHeight - 60, ev.clientY - dy)) + 'px'; panel.style.right = panel.style.bottom = 'auto'; };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); e.preventDefault();
  };
  const close = () => { if (panel) panel.hidden = true; sync(); $$('.calc-toggle-own').forEach(b => { b.textContent = '🧮 계산기'; b.setAttribute('aria-expanded', 'false'); }); };
  const toggle = (inp, btn) => (panel && !panel.hidden) ? close() : open(inp, btn);
  const mkBtn = inp => { const b = h('button', { class:'btn calc-toggle', type:'button', 'aria-expanded':'false', onclick: () => toggle(inp, b) }, '🧮 계산기'); toggles.add(b); sync(); return b; };
  /* 도수분포표 첫 계급: 4 ~ 8 + (이상/미만) → 4이상 ~ 8미만 (위 첨자) */
  const clsSup = () => $$('td.cls > .unit-note:not([data-sup])').forEach(un => {
    un.dataset.sup = '1'; const td = un.parentNode; const spans = $$('span', un); if (spans.length !== 2) return;
    const txt = [...td.childNodes].filter(n => n !== un).map(n => n.textContent).join('');
    const m = txt.match(/^\s*([\d.,\s]+?)\s*~\s*([\d.,\s]+?)\s*$/); if (!m) return;
    td.replaceChildren(h('span', { class:'cls-pair sup-pair' }, m[1].trim(), h('sup', {}, '이상'), h('span', { class:'tilde' }, '~'), m[2].trim(), h('sup', {}, '미만')));
  });
  const decorate = () => {
    clsSup();
    $$('input[data-calc]:not([data-calc-done])').forEach(inp => {
      inp.dataset.calcDone = '1';
      inp.addEventListener('focus', () => { target = inp; });
      const qa = (() => { let a = inp.parentElement; while (a && a !== document.body){ const x = [...a.children].find(c => c.classList && c.classList.contains('quiz-actions')); if (x) return x; a = a.parentElement; } return null; })();
      if (qa){ if (!qa.querySelector('.calc-toggle')) qa.prepend(mkBtn(inp)); return; }
      const row = inp.closest('.quiz-input-row, .calc-row, .btn-row');
      if (row){ if (row.querySelector('.calc-toggle')) return; const firstBtn = [...row.children].find(c => c.classList && c.classList.contains('btn')); row.insertBefore(mkBtn(inp), firstBtn || null); return; }
      const box = inp.closest('.table-wrap') || inp.closest('.pm-inputs') || inp.parentNode;
      if (box.nextElementSibling && box.nextElementSibling.classList.contains('calc-row-tg')) return;
      const nb = box.nextElementSibling; if (nb && nb.classList.contains('btn-row')){ if (!nb.querySelector('.calc-toggle')) nb.prepend(mkBtn(inp)); return; }
      box.after(h('div', { class:'btn-row calc-row-tg' }, mkBtn(inp)));
    });
    sync();
  };
  let raf = 0;
  new MutationObserver(() => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; decorate(); }); }).observe(document.documentElement, { childList:true, subtree:true });
  window.addEventListener('hashchange', close);
  return { open, close, decorate, evaluate };
})();
</script>
